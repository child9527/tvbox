name: 恢复 sync.py 并加入 okhttp UA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 从已知良好提交恢复并打补丁
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/child9527/tvbox/e5576814c2d899217958e0e561e10c05933368e5/scripts/sync.py" -o scripts/sync.py

          python3 << 'PY'
          from pathlib import Path
          path = Path("scripts/sync.py")
          text = path.read_text(encoding="utf-8")

          old_headers = '''HEADERS = {
    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,application/json,*/*;q=0.8"
}
'''

          new_headers = '''HEADERS = {
    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,application/json,*/*;q=0.8"
}
# 部分源站（如 kstore）会拒绝浏览器 UA，需用 TVBox/okhttp 客户端身份
TVBOX_HEADERS = {
    "User-Agent": "okhttp/3.12.0",
    "Accept": "*/*",
}
'''

          if "TVBOX_HEADERS" not in text:
              if old_headers not in text:
                  raise SystemExit("HEADERS block not found")
              text = text.replace(old_headers, new_headers, 1)

          old_fetch = '''    is_gh, raw, _ = extract_raw(url)
    target_url = raw if is_gh else url
    print(f"📥 正在拉取 [{name}]，目标地址: {target_url}")

    try:
        r = requests.get(target_url, headers=HEADERS, timeout=10)
        if r.status_code != 200:
            print(f"❌ 请求失败，HTTP 状态码: {r.status_code}")
            task["status"] = f"http{r.status_code}"
            return False
        raw_content = r.content.decode("utf-8", errors="ignore").strip()
        task["status"] = "ok"
    except Exception as e:
        print(f"❌ 请求异常 [{name}]: {e}")
        task["status"] = "error"
        return False
'''

          new_fetch = '''    is_gh, raw, _ = extract_raw(url)
    target_url = raw if is_gh else url
    print(f"📥 正在拉取 [{name}]，目标地址: {target_url}")

    raw_content = None
    last_status = None
    last_error = None

    # 先用浏览器 UA；失败再用 TVBox/okhttp UA 重试（应对 access denied by file access rule）
    for label, headers in (("默认UA", HEADERS), ("okhttp UA", TVBOX_HEADERS)):
        try:
            r = requests.get(target_url, headers=headers, timeout=15)
            if r.status_code == 200:
                raw_content = r.content.decode("utf-8", errors="ignore").strip()
                if label != "默认UA":
                    print(f"  ✓ [{name}] 使用 {label} 拉取成功")
                break
            last_status = r.status_code
            print(f"  ⚠️ [{name}] {label} 失败，HTTP {r.status_code}")
        except Exception as e:
            last_error = e
            print(f"  ⚠️ [{name}] {label} 异常: {e}")

    if raw_content is None:
        if last_status is not None:
            print(f"❌ 请求失败，HTTP 状态码: {last_status}")
            task["status"] = f"http{last_status}"
        else:
            print(f"❌ 请求异常 [{name}]: {last_error}")
            task["status"] = "error"
        return False

    task["status"] = "ok"
'''

          if "okhttp UA" not in text:
              if old_fetch not in text:
                  raise SystemExit("fetch block not found")
              text = text.replace(old_fetch, new_fetch, 1)

          path.write_text(text, encoding="utf-8")
          print("patched ok, size=", path.stat().st_size)
          PY

          python3 -m py_compile scripts/sync.py
          echo "syntax ok"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/sync.py
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "恢复完整 sync.py 并加入 okhttp UA 回退拉取 [skip ci]"
            git push origin main
            echo "已推送"
          fi

      - name: 删除本临时工作流
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/restore_sync_okhttp.yml || true
          if ! git diff --staged --quiet; then
            git commit -m "清理临时恢复工作流 [skip ci]"
            git push origin main
          fi
