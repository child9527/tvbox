name: 自动解密并同步one接口文件

on:
  schedule:
    # 唤醒检查频率：每 6 小时检查一次是否到了“随机时间点”
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  decrypt_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装加密库依赖
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 执行核心调度逻辑 (按行读取 next_run.txt)
        id: process_logic
        run: |
          python - << 'EOF'
          import os
          import time
          import random
          import sys
          import urllib.request

          state_file = "next_run.txt"          # 根目录状态与 URL 列表文件
          decrypted_file = "one.json"          # 根目录解密文件
          current_time = int(time.time())

          # 读取文件所有行
          lines = []
          if os.path.exists(state_file):
              with open(state_file, 'r', encoding='utf-8') as f:
                  lines = [line.strip() for line in f.readlines()]

          # 确保 lines 列表至少有 5 行（不足部分用空字符串补齐，防止索引越界）
          while len(lines) < 5:
              lines.append("")

          # -------------------------------------------------------------
          # 1. 解析第 1 行时间戳、第 2 行 Content-Length、第 5 行起的目标 URL
          # -------------------------------------------------------------
          target_time_str = lines[0]
          local_size = lines[1]
          
          # 从第 5 行开始获取 URL 列表 (索引 4 开始)
          urls = [line for line in lines[4:] if line.startswith("http://") or line.startswith("https://")]

          if not urls:
              print("✗ 未在 next_run.txt 第 5 行及以后找到有效 URL！退出任务。")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("should_decrypt=false\n")
              sys.exit(0)

          target_url = urls[0]  # 取第 5 行匹配到的第一个 URL 接口
          print(f">> 提取到的目标 URL: {target_url}")

          # 判定是否首次运行
          try:
              target_time = int(target_time_str)
          except ValueError:
              target_time = 0

          is_first_run = (target_time == 0) or (not os.path.exists(decrypted_file))

          # -------------------------------------------------------------
          # 2. 检查随机时间（未到时间直接退出，绝不发起网络请求）
          # -------------------------------------------------------------
          if not is_first_run and current_time < target_time:
              remaining_hours = round((target_time - current_time) / 3600, 1)
              print(f">> [时间未到] 距离下一次随机嗅探还需等待 {remaining_hours} 小时，立即退出。")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("should_decrypt=false\n")
              sys.exit(0)

          print(">> [时间已到/首次运行] 开始伪装 TVBox 向服务器发起 HEAD 请求...")

          # -------------------------------------------------------------
          # 3. 伪装 TVBox 发起 HEAD 嗅探
          # -------------------------------------------------------------
          headers = {
              'User-Agent': 'okhttp/3.12.0',
              'Accept': '*/*',
              'Connection': 'Keep-Alive'
          }

          remote_size = ""
          try:
              req = urllib.request.Request(target_url, headers=headers, method='HEAD')
              with urllib.request.urlopen(req, timeout=12) as resp:
                  remote_size = resp.headers.get('Content-Length', '').strip()
                  print(f"[TVBox 伪装嗅探成功] 远程 Content-Length: '{remote_size}', 本地记录: '{local_size}'")
          except Exception as e:
              print(f"✗ 伪装获取 Content-Length 失败: {e}")
              if not is_first_run:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write("should_decrypt=false\n")
                  sys.exit(0)

          # 将目标 URL 保存到环境变量供下个步骤解密调用
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"target_url={target_url}\n")

          # -------------------------------------------------------------
          # 4. 嗅探成功，安全更新第 1、2 行，并保留第 3 行及以后的所有内容
          # -------------------------------------------------------------
          random_delay = random.randint(24 * 3600, 72 * 3600)
          next_target_time = current_time + random_delay

          # 仅替换内存中的第 1 行和第 2 行
          lines[0] = str(next_target_time)
          lines[1] = remote_size if remote_size != "" else local_size

          # 原样写回文件（保留后续行的 URL 和其他工作流数据）
          with open(state_file, 'w', encoding='utf-8') as f:
              f.write("\n".join(lines) + "\n")

          print(f">> 已安全更新 {state_file} 前 2 行（第 3 行及之后内容完整保留）。")

          # 比对 Content-Length 决定是否解密
          if is_first_run or (remote_size != "" and remote_size != local_size):
              print(">> [文件有变动/首次运行] 触发解密！")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("should_decrypt=true\n")
          else:
              print(">> [文件无变动] 上游 Content-Length 未变，不执行解密。")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("should_decrypt=false\n")
          EOF

      - name: 启动解密程序 (自动使用第 5 行读取到的 URL)
        if: steps.process_logic.outputs.should_decrypt == 'true'
        run: |
          TARGET_URL="${{ steps.process_logic.outputs.target_url }}"
          python tvbox.py "$TARGET_URL" "one.json" dec

      - name: 提交改动到仓库
        run: |
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          git add next_run.txt one.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto Sync: 更新于 $BEIJING_TIME"
            git push
          else
            echo "没有文件发生改动，无需 Push。"
          fi
