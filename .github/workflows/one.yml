name: 手动或触发时自动解密 one.json

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/tvbox.py"
      - ".github/workflows/decrypt-one.yml"

jobs:
  decrypt-one:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 判断是否需要处理 one.json（完整日志）
        id: check_one
        run: |
          python - << 'EOF'
          import os, time, urllib.request, datetime, sys

          STATE_FILE = "task/one_next_run.txt"
          URL = "https://9877.kstore.space/one.json"
          LOCAL = "json/one.json"

          # 读取状态文件
          lines = []
          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  lines = f.read().splitlines()

          while len(lines) < 2:
              lines.append("")

          # 上次记录的 Content-Length
          last_size = lines[1].strip()

          now = int(time.time())
          utc_now = datetime.datetime.utcnow()
          bj_now = utc_now + datetime.timedelta(hours=8)

          print("==============================================")
          print(f"当前时间（UTC）: {utc_now.strftime('%Y-%m-%d %H:%M:%S')}")
          print(f"当前时间（北京时间）: {bj_now.strftime('%Y-%m-%d %H:%M:%S')}")
          print("==============================================")

          # 首次运行判断
          is_first = not os.path.exists(STATE_FILE) or not os.path.exists(LOCAL)
          print(f"是否首次运行: {'是' if is_first else '否'}")

          print(">> 开始 HEAD 请求检查远端大小...")

          headers = {
              "User-Agent": "okhttp/3.12.0",
              "Accept": "*/*",
              "Connection": "Keep-Alive"
          }

          remote_size = ""
          try:
              req = urllib.request.Request(URL, headers=headers, method="HEAD")
              with urllib.request.urlopen(req, timeout=12) as resp:
                  remote_size = resp.headers.get("Content-Length", "").strip()
          except Exception as e:
              print(f"HEAD 请求失败: {e}")

          print(f"本地记录大小: {last_size}")
          print(f"远端大小: {remote_size}")

          need = is_first or (remote_size and remote_size != last_size)
          print(f"是否需要解密 one.json: {'是' if need else '否'}")

          # 更新状态文件（只记录远端大小，不再记录时间）
          lines[0] = "0"  # 占位，不再使用
          lines[1] = remote_size if remote_size else last_size

          with open(STATE_FILE, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"need={'true' if need else 'false'}\n")
          EOF

      - name: 解密 one.json（仅在需要时）
        if: steps.check_one.outputs.need == 'true'
        run: |
          python scripts/tvbox.py "https://9877.kstore.space/one.json" "json/one.json" dec

      - name: 提交改动
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add task/one_next_run.txt json/one.json
          if ! git diff --staged --quiet; then
            BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Auto Sync one.json: 更新于 $BEIJING_TIME"
            git push
          else
            echo "one.json 无变化，跳过提交"
          fi
