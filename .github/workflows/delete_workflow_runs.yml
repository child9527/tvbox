name: Full Cleanup (runs + artifacts)

on:
  schedule:
    - cron: '0 0 1,16 * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Delete workflow runs (all workflows)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}

          # 保留最近 3 天
          retain_days: 3

          # 每个 workflow 至少保留 12 条
          keep_minimum_runs: 12

          # 删除所有状态的 workflow（用 pattern）
          delete_workflow_by_state_pattern: "completed|cancelled|failure|skipped"

          # 删除所有结论的 run（用 pattern）
          delete_run_by_conclusion_pattern: "success|failure|cancelled|skipped"

      - name: Delete all artifacts (via GitHub API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "开始清理所有 artifacts..."

          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].id')

          if [ -z "$artifacts" ]; then
            echo "没有 artifacts 可清理。"
            exit 0
          fi

          for id in $artifacts; do
            echo "删除 artifact: $id"
            gh api \
              --method DELETE \
              repos/${{ github.repository }}/actions/artifacts/$id \
              || echo "删除失败（跳过）"
          done

          echo "所有 artifacts 清理完成。"
