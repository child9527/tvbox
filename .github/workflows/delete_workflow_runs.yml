name: Auto Clean Workflow Runs

on:
  schedule:
    # 每半个月运行一次（每月 1 号和 15 号的 00:00 UTC 执行）
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # 保留手动触发按钮，方便随时测试

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # 必须授予写权限，才能通过 API 删除历史日志
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3          # 只保留最近 3 天的日志
          keep_minimum_runs: 10   # 每个工作流最多保留 10 条日志
