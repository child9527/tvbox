name: Convert Rules and Sync to Gitee

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'direct.txt'
      - 'ai.txt'
  workflow_dispatch:

jobs:
  convert-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert TXT to Custom Clash YAML Format
        run: |
          echo "=================== [步骤 1] 开始转换文本规则 ==================="
          python -c "
          import os

          def convert_txt_to_yaml(txt_file, yaml_file):
              print(f'[提示] 正在检查源文件: {txt_file}')
              if not os.path.exists(txt_file):
                  print(f'[警告] 源文件 {txt_file} 不存在，跳过转换。')
                  return
              
              lines = []
              with open(txt_file, 'r', encoding='utf-8') as f:
                  raw_lines = f.readlines()
                  print(f'[提示] {txt_file} 读取成功，共 {len(raw_lines)} 行原始文本')
                  
                  for line in raw_lines:
                      line = line.strip()
                      if not line or line.startswith('#'):
                          continue
                      if not line.startswith('+.') and not line.startswith('.'):
                          line = '+.' + line
                      lines.append(f'  - \'{line}\'')
              
              with open(yaml_file, 'w', encoding='utf-8') as f:
                  f.write('payload:\n')
                  f.write('\n'.join(lines) + '\n')
              
              print(f'[成功] 转换完成: {txt_file} -> {yaml_file}，写入 {len(lines)} 条有效规则')

          convert_txt_to_yaml('direct.txt', 'my-direct.yaml')
          convert_txt_to_yaml('ai.txt', 'my-ai.yaml')
          "
          echo "=================== [步骤 1] 规则转换结束 ==================="

      - name: Setup SSH Config and Diagnostics
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          echo "=================== [步骤 2] 配置 SSH 与 Gitee 域名映射 ==================="
          echo "[诊断] 当前 Runner 环境中的 Git 版本:"
          git --version
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 1. 写入私钥文件并严格授权
          echo "$SSH_KEY" > ~/.ssh/gitee_id_ed25519
          chmod 600 ~/.ssh/gitee_id_ed25519
          
          # 2. 写入 SSH Config，彻底替代全局 GIT_SSH_COMMAND 变量，规避 Git 参数解析冲突
          cat << 'EOF' > ~/.ssh/config
          Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/gitee_id_ed25519
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config
          
          echo "[提示] SSH 配置文件 ~/.ssh/config 建立完毕"
          
          echo "[诊断] 正在测试 Gitee SSH 免密连通性..."
          ssh -T git@gitee.com || true
          echo "=================== [步骤 2] SSH 诊断结束 ==================="

      - name: Clone Gitee and Push Files
        run: |
          echo "=================== [步骤 3] 克隆 Gitee 仓库并同步提交 ==================="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "[提示] 开始执行 git clone..."
          # 使用原生命令，直接依靠 ~/.ssh/config 自动匹配密钥
          git clone git@gitee.com:child9527/mybox.git gitee_temp
          
          echo "[提示] 正在将生成的 YAML 复制到目标仓库目录..."
          cp -v my-direct.yaml gitee_temp/
          cp -v my-ai.yaml gitee_temp/
          
          cd gitee_temp
          echo "[诊断] 进入 gitee_temp 目录，当前路径为:"
          pwd
          
          echo "[诊断] 查看已复制文件的目录状态:"
          ls -la my-*.yaml
          
          echo "[诊断] 查看本地 git status:"
          git status
          
          git add my-direct.yaml my-ai.yaml
          
          echo "[诊断] 查看已暂存的修改差异 (git diff --staged):"
          git diff --staged
          
          if git diff --staged --quiet; then
            echo "[提示] 经比对无任何文件变更，跳过 Commit 和 Push 操作。"
          else
            echo "[提示] 检测到变更内容，开始提交并推送至 Gitee 远程仓库..."
            git commit -m "auto: update custom rulesets (my-direct/my-ai) from GitHub Actions [skip ci]"
            git push origin master
            echo "[成功] 文件更新已顺利推送至 Gitee！"
          fi
          echo "=================== [步骤 3] 全流程执行完毕 ==================="
