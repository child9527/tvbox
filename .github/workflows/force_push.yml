name: 强制解密并推送到Gitee

on:
  workflow_dispatch:

jobs:
  force-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: Step 1 - Encrypt ALL json files (no diff check)
        id: encrypt_all
        run: |
          mkdir -p encrypted
          processed=()

          for f in json/*.json; do
            base="${f%.*}"
            bin="${base}.bin"

            echo "🔐 加密: $f → $bin"
            python scripts/tvbox.py "$f" "$bin" enc || true

            if [ -f "$bin" ]; then
              processed+=("$f")
            fi
          done

          echo "encrypted_files=${processed[*]}" >> $GITHUB_OUTPUT

      - name: Step 2 - Setup SSH
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Step 3 - Push ALL encrypted json to Gitee (no conditions)
        run: |
          git clone git@gitee.com:child9527/mybox.git gitee_temp
          cd gitee_temp

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p json

          # 把所有 .bin 改名为 .json 推送
          for f in ${{ steps.encrypt_all.outputs.encrypted_files }}; do
            base="$(basename "$f" .json)"
            cp "../json/${base}.bin" "json/${base}.json"
            rm -f "../json/${base}.bin"
          done

          git add json/*.json

          NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          git commit -m "Force push ALL encrypted JSON (${NOW}) [skip ci]"
          git push origin master

          echo "🚀 已无脑推送到 Gitee"
