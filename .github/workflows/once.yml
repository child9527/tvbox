name: 批量移动仓库文件到新目录结构

on:
  workflow_dispatch:

jobs:
  move_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 创建目标目录
        run: |
          mkdir -p json
          mkdir -p clash_rules
          mkdir -p scripts
          mkdir -p task

      - name: 移动根目录的 *.json 到 json/
        run: |
          shopt -s nullglob
          for f in *.json; do
            echo "移动 $f → json/$f"
            git mv "$f" "json/$f"
          done

      - name: 移动 ai.txt 和 direct.txt 到 clash_rules/
        run: |
          if [ -f ai.txt ]; then git mv ai.txt clash_rules/ai.txt; fi
          if [ -f direct.txt ]; then git mv direct.txt clash_rules/direct.txt; fi

      - name: 移动脚本文件到 scripts/
        run: |
          if [ -f github.script.user.js ]; then git mv github.script.user.js scripts/github.script.user.js; fi
          if [ -f tvbox.py ]; then git mv tvbox.py scripts/tvbox.py; fi

      - name: 移动 next_run.txt 到 task/
        run: |
          if [ -f next_run.txt ]; then git mv next_run.txt task/next_run.txt; fi

      - name: 提交改动
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          if ! git diff --staged --quiet; then
            git commit -m "Auto Move: 重新整理仓库目录结构"
            git push
          else
            echo "没有文件需要移动。"
          fi
