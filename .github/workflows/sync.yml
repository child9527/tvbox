name: 批量同步、加密与双端推送

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 全局设置环境变量，强制所有 Step 使用北京时间
env:
  TZ: Asia/Shanghai

jobs:
  sync_and_push:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 GitHub 仓库
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests commentjson

      # 4. 执行同步脚本（解密、清洗、写本地、比较MD5、更新task.json）
      - name: Run sync script
        run: |
          python scripts/sync.py

      # 5. 检查本地是否有变动
      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # 6. 如果有变动：提交并推送变动回 GitHub 本地仓库
      - name: Commit and push to GitHub
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add json/ task/task.json
          
          # 获取北京时间作为 Commit Message
          COMMIT_TIME=$(date +'%Y-%m-%d %H:%M:%S')
          git commit -m "Auto sync: update json and tasks [$COMMIT_TIME]"
          git push

      # 7. 加密并推送到 Gitee（完结步骤）
      # 注：建议在 GitHub Repo Settings -> Secrets and variables -> Actions 中配置 GITEE_SSH_KEY
      - name: Encrypt and Push to Gitee
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          # 运行你的加密脚本（针对 md5_changed == True 的文件加密）
          # python scripts/encrypt.py
          
          # 配置 Gitee 远程仓库推送
          if [ -n "$GITEE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$GITEE_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          fi
          
          # 强制/同步推送到 Gitee 仓库
          # git push git@gitee.com:child9527/your_repo.m4a main --force
