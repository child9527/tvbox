name: 批量同步、加密与双端推送

on:
  schedule:
    - cron: '0 17 * * *'   # 北京时间凌晨1点运行
  workflow_dispatch:
  push:
    paths:
      - "task/task.json"
      - "json/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装python和依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests commentjson pycryptodome

      - name: Step 1 - 获取完整文件清单
        id: sync_json
        run: |
          python scripts/sync.py

      - name: Step 2 - 差异检查 (GitHub修改 + Gitee缺失)
        id: diff_check
        env:
          GITEE_API_URL: "https://gitee.com/api/v5/repos/child9527/mybox/contents/json"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          changed_files=()

          echo "🔍 检查 GitHub 本地是否有变化..."
          # 1. 暂存所有 json 变动以及 task/task.json 变动
          git add json/*.json task/task.json

          # 检查 json/*.json 是否有更新
          for file in json/*.json; do
            if [ -n "$(git status --porcelain "$file")" ]; then
              echo "📌 本地 json 变更: $file"
              changed_files+=("$file")
            fi
          done

          echo "🌐 从 Gitee API 获取 json 目录文件列表..."
          gitee_json_list=$(curl -s "$GITEE_API_URL" | jq -r '.[].name')

          echo "📁 Gitee 现有文件:"
          echo "$gitee_json_list"

          echo "🔎 检查 Gitee 是否缺少文件..."
          for file in json/*.json; do
            base="$(basename "$file")"
            if ! echo "$gitee_json_list" | grep -q "^$base$"; then
              echo "📌 Gitee 缺少: $base → 强制加入 changed_files"
              # 只有当 changed_files 不包含该文件时才添加，避免重复
              if [[ ! " ${changed_files[*]} " =~ " ${file} " ]]; then
                changed_files+=("$file")
              fi
            fi
          done

          # 2. 核心修正：判断全局暂存区（含 task/task.json 和 json 目录）是否有变动
          has_git_changes=false
          if [ -n "$(git status --porcelain)" ]; then
            has_git_changes=true
            NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "更新 task.json 及 json 文件于 ${NOW} [skip ci]"
            git push
          fi

          # 如果既没有 git 变更（GitHub端），且 Gitee 也不缺文件，才真正的退出
          if [ ${#changed_files[@]} -eq 0 ] && [ "$has_git_changes" = "false" ]; then
            echo "🎉 无需处理：本地无变化且 Gitee 无缺失"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changed_files=${changed_files[*]}" >> $GITHUB_OUTPUT

      - name: Step 3 - 加密
        id: encrypt_step
        if: steps.diff_check.outputs.has_changes == 'true'
        run: |
          CHANGED="${{ steps.diff_check.outputs.changed_files }}"
          processed=()

          for f in $CHANGED; do
            if [ -f "$f" ]; then
              base="${f%.*}"
              bin="${base}.bin"
              python scripts/tvbox.py "$f" "$bin" enc || true
              if [ -f "$bin" ]; then
                processed+=("$f")
              fi
            fi
          done

          # 修正：即使 changed_files 为空（如仅 task.json 变动），只要有加密或者要同步 task.json，就继续推进 Step 5
          echo "has_encrypted=true" >> $GITHUB_OUTPUT
          echo "encrypted_files=${processed[*]}" >> $GITHUB_OUTPUT

      - name: Step 4 - 配置SSH传输
        if: steps.encrypt_step.outputs.has_encrypted == 'true'
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Step 5 - 推送到Gitee
        if: steps.encrypt_step.outputs.has_encrypted == 'true'
        run: |
          git clone git@gitee.com:child9527/mybox.git gitee_temp
          cd gitee_temp

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 确保 Gitee 临时目录下存在 json 和 task 文件夹
          mkdir -p json task

          # 1. 移动/覆盖加密后的 JSON 文件
          for f in ${{ steps.encrypt_step.outputs.encrypted_files }}; do
            base="$(basename "$f" .json)"
            if [ -f "../json/${base}.bin" ]; then
              cp "../json/${base}.bin" "json/${base}.json"
              rm -f "../json/${base}.bin"
            fi
          done

          # 2. 复制更新后的 task/task.json 到 Gitee 目录
          if [ -f "../task/task.json" ]; then
            cp "../task/task.json" "task/task.json"
          fi

          # 3. 暂存 json 目录下所有的 json 以及 task/task.json
          git add json/*.json task/task.json

          # 4. 检查 Gitee 工作区是否有任何变更（去掉了仅限定 json 目录的判定）
          if [ -n "$(git status --porcelain)" ]; then
            NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "同步加密 JSON 及 task.json (${NOW}) [skip ci]"
            git push origin master
          else
            echo "🎉 Gitee 侧无任何变动，跳过推送"
          fi
