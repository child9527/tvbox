name: 同步多文件&推送到Gitee
on:
  workflow_dispatch:
  push:
    paths:
      - "task/json.txt"
      - "json/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests commentjson pycryptodome

      - name: Run sync
        run: |
          python scripts/sync.py
