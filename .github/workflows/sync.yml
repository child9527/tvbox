name: 批量同步、加密与双端推送 (GitHub + Gitee)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch-sync-and-encrypt:
    name: 批量处理、加密及推送
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome

      - name: 1. 拉取并清理注释后的 JSON
        id: process_json
        env:
          MY_REPO: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import requests, re, os, json, sys

          TASKS = [
              {"name": "x.json", "url": "https://raw.githubusercontent.com/alantang1977/X/main/X.json"},
              {"name": "pj.json", "url": "https://raw.githubusercontent.com/mcp2016/TVBox/main/pj.json"}
          ]

          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def remove_comments(text):
              # 删除所有 // 开头的注释（避免误删 http:// https://）
              clean_lines = []
              for line in text.splitlines():
                  line_clean = re.sub(r'(?<!:)//.*$', '', line)
                  if line_clean.strip():
                      clean_lines.append(line_clean)
              return "\n".join(clean_lines)

          for task in TASKS:
              url = task["url"]
              name = task["name"]
              try:
                  resp = requests.get(url, headers=HEADERS, timeout=10)
                  if resp.status_code != 200:
                      print(f"❌ 拉取失败: {url}")
                      sys.exit(1)
                  text = resp.content.decode("utf-8", errors="ignore").replace("\ufeff", "")
                  cleaned = remove_comments(text)
                  # 校验 JSON 是否合法
                  try:
                      json.loads(cleaned)
                  except Exception as e:
                      print(f"❌ {name} 清理后仍不是合法 JSON: {e}")
                      sys.exit(1)
                  with open(name, "w", encoding="utf-8") as f:
                      f.write(cleaned)
                  print(f"✅ 已清理注释并保存: {name}")
              except Exception as e:
                  print(f"❌ 处理异常 {name}: {e}")
                  sys.exit(1)
          EOF

      - name: 2. 加密 JSON 为 BIN
        run: |
          if [ ! -f "tvbox.py" ]; then
            echo "❌ 错误：未找到 tvbox.py 脚本！"
            exit 1
          fi
          for target in "x.json" "pj.json"; do
            if [ -f "$target" ]; then
              base="${target%.*}"
              bin="${base}.bin"
              echo "正在加密: $target -> $bin"
              python tvbox.py "$target" "$bin" enc
              if [ ! -f "$bin" ]; then
                echo "❌ 加密失败: $target"
                exit 1
              fi
            fi
          done

      - name: 3. 提交清理后的 JSON 到 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f x.json pj.json
          git rm --cached *.bin *.BIN 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "提示：无变化，跳过提交。"
          else
            git commit -m "auto: update json files (comments removed) [skip ci]"
            git push
            echo "✅ 已推送清理后的 JSON 到 GitHub"
          fi

      - name: 4. 配置 SSH 与 Gitee
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/gitee_id_ed25519
          chmod 600 ~/.ssh/gitee_id_ed25519
          cat << 'EOF' > ~/.ssh/config
          Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/gitee_id_ed25519
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: 5. 推送加密后的 JSON 到 Gitee
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone git@gitee.com:child9527/mybox.git gitee_temp
          cd gitee_temp
          git rm -f *.bin *.BIN 2>/dev/null || true
          cd ..
          for b in "x.bin" "pj.bin"; do
            target="${b%.*}.json"
            cp -v "$b" "gitee_temp/$target"
          done
          cd gitee_temp
          git add -A
          if git diff --staged --quiet; then
            echo "提示：Gitee 无变化，跳过提交。"
          else
            git commit -m "auto: update encrypted json files [skip ci]"
            git push origin HEAD
            echo "✅ 已推送加密后的 JSON 到 Gitee"
          fi

      - name: 6. 清理临时文件
        if: always()
        run: |
          rm -rf gitee_temp
          rm -f *.bin *.BIN
          rm -f .hash_cache.json
          echo "[完成] 清理临时文件"
