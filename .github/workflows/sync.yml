name: 批量同步、加密与双端推送

on:
  workflow_dispatch:
  push:
    paths:
      - "task/json.txt"
      - "json/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests commentjson pycryptodome

      - name: Step 1 - Sync JSON
        id: sync_json
        run: |
          python scripts/sync.py

      - name: Step 2 - Diff check
        id: diff_check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          changed_files=()

          # 1. 检查 GitHub 本地是否有变化
          for file in json/*.json; do
            git add -f "$file"
            if [ -n "$(git status --porcelain "$file")" ]; then
              echo "🔍 本地变更: $file"
              changed_files+=("$file")
            else
              git restore --staged "$file"
            fi
            done

          # 2. 克隆 Gitee 仓库（只读）
          echo "🔧 检查 Gitee 仓库是否缺少文件..."
          git clone --depth=1 git@gitee.com:child9527/mybox.git gitee_check
          mkdir -p gitee_check/json

          # 3. 检查 Gitee 是否缺少某个 JSON
          for file in json/*.json; do
            base="$(basename "$file")"
            if [ ! -f "gitee_check/json/$base" ]; then
              echo "📌 Gitee 缺少文件: $base → 强制加入 changed_files"
              changed_files+=("$file")
            fi
          done

          # 4. 判断是否有需要处理的文件
          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 5. GitHub 只在本地有变化时 commit（不会因为 Gitee 缺失而 commit）
          if [ -n "$(git status --porcelain json)" ]; then
            NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "更新于 ${NOW} [skip ci]"
            git push
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changed_files=${changed_files[*]}" >> $GITHUB_OUTPUT


      - name: Step 3 - Encrypt
        id: encrypt_step
        if: steps.diff_check.outputs.has_changes == 'true'
        run: |
          CHANGED="${{ steps.diff_check.outputs.changed_files }}"
          processed=()

          for f in $CHANGED; do
            base="${f%.*}"
            bin="${base}.bin"
            python scripts/tvbox.py "$f" "$bin" enc || true
            if [ -f "$bin" ]; then
              processed+=("$f")
            fi
          done

          if [ ${#processed[@]} -eq 0 ]; then
            echo "has_encrypted=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_encrypted=true" >> $GITHUB_OUTPUT
          echo "encrypted_files=${processed[*]}" >> $GITHUB_OUTPUT

      - name: Step 4 - Setup SSH
        if: steps.encrypt_step.outputs.has_encrypted == 'true'
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no" >> ~/.ssh/config

          - name: Step 5 - Push to Gitee
            if: steps.encrypt_step.outputs.has_encrypted == 'true'
            run: |
              git clone git@gitee.com:child9527/mybox.git gitee_temp
              cd gitee_temp

              # ⭐ 必须在 Gitee 仓库里设置身份
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              mkdir -p json

              for f in ${{ steps.encrypt_step.outputs.encrypted_files }}; do
                base="$(basename "$f" .json)"
                cp "../json/${base}.bin" "json/${base}.json"
                rm -f "../json/${base}.bin"
              done

              git add json/*.json

              if [ -n "$(git status --porcelain json)" ]; then
                NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
                git commit -m "同步加密 JSON (${NOW}) [skip ci]"
                git push origin master
              fi

