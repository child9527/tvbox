name: 批量同步、加密与双端推送

on:
  schedule:
    - cron: '0 17 * * *'   # 北京时间凌晨1点运行
  workflow_dispatch:
  push:
    paths:
      - "task/task.json"
      - "json/**"

jobs:
  sync:
    name: 设置与同步任务
    runs-on: ubuntu-latest

    steps:
      - name: 拉取 GitHub 仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 及依赖环境
        run: |
          python -m pip install --upgrade pip
          pip install requests commentjson pycryptodome

      - name: 步骤 1 - 执行同步脚本获取文件清单
        id: sync_json
        run: |
          python scripts/sync.py

      - name: 步骤 2 - 检查文件差异并更新 GitHub 状态
        id: diff_check
        env:
          GITEE_API_URL: "https://gitee.com/api/v5/repos/child9527/mybox/contents/json"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          changed_files=()

          echo "🔍 检查 GitHub 本地是否有变化..."
          git add json/*.json task/task.json

          for file in json/*.json; do
            if [ -n "$(git status --porcelain "$file")" ]; then
              echo "📌 本地 json 变更: $file"
              changed_files+=("$file")
            fi
          done

          echo "🌐 从 Gitee API 获取 json 目录文件列表..."
          gitee_json_list=$(curl -s "$GITEE_API_URL" | jq -r '.[].name?' 2>/dev/null || true)

          echo "📁 Gitee 现有文件:"
          echo "$gitee_json_list"

          echo "🔎 检查 Gitee 是否缺少文件..."
          for file in json/*.json; do
            base="$(basename "$file")"
            if ! echo "$gitee_json_list" | grep -q "^$base$"; then
              echo "📌 Gitee 缺少: $base → 强制加入 changed_files"
              if [[ ! " ${changed_files[*]} " =~ " ${file} " ]]; then
                changed_files+=("$file")
              fi
            fi
          done

          has_git_changes=false
          if [ -n "$(git status --porcelain)" ]; then
            has_git_changes=true
            NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "更新于 ${NOW} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

          if [ ${#changed_files[@]} -eq 0 ] && [ "$has_git_changes" = "false" ]; then
            echo "🎉 无需处理：本地无变化且 Gitee 无缺失"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changed_files=${changed_files[*]}" >> $GITHUB_OUTPUT

      - name: 步骤 3 - 执行 JSON 批量加密（只加密 md5_changed=true 的）
        id: encrypt_step
        if: steps.diff_check.outputs.has_changes == 'true'
        run: |
          CHANGED="${{ steps.diff_check.outputs.changed_files }}"
          processed=()

          # 读取 md5_changed 标记
          md5_changed_list=$(jq -r '.[] | select(.md5_changed==true) | .name' task/task.json)

          for f in $CHANGED; do
            base="$(basename "$f" .json)"

            # 只有 md5_changed=true 的才加密
            if echo "$md5_changed_list" | grep -q "^$base$"; then
              bin="${base}.bin"
              python scripts/tvbox.py "$f" "$bin" enc || true
              if [ -f "$bin" ]; then
                processed+=("$f")
              fi
            fi
          done

          echo "has_encrypted=true" >> $GITHUB_OUTPUT
          echo "encrypted_files=${processed[*]}" >> $GITHUB_OUTPUT

      - name: 步骤 4 - 配置 Gitee SSH 密钥传输认证
        if: steps.encrypt_step.outputs.has_encrypted == 'true'
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no" >> ~/.ssh/config

      - name: 步骤 5 - 部署加密 JSON 至 Gitee 仓库（只推送 md5_changed=true 的）
        if: steps.encrypt_step.outputs.has_encrypted == 'true'
        run: |
          git clone --depth 1 git@gitee.com:child9527/mybox.git gitee_temp
          cd gitee_temp

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p json

          for f in ${{ steps.encrypt_step.outputs.encrypted_files }}; do
            base="$(basename "$f" .json)"
            if [ -f "../json/${base}.bin" ]; then
              cp "../json/${base}.bin" "json/${base}.json"
              rm -f "../json/${base}.bin"
            fi
          done

          git add json/*.json

          if [ -n "$(git status --porcelain)" ]; then
            NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "同步加密 JSON (${NOW}) [skip ci]"
            git push origin master
          else
            echo "🎉 Gitee 侧无任何变动，跳过推送"
          fi
