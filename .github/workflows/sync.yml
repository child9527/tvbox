name: 批量同步、加密与双端推送 (GitHub + Gitee)

on:
  push: 
    paths:
    - 'task/json.txt'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch-sync-and-encrypt:
    name: 批量处理、加密及推送
    runs-on: ubuntu-latest

    steps:
      - name: 设置 Git 身份（必须最前）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome commentjson

      - name: 1. 多文件拉取、精简剔除注释行、JSON 格式统一校验与导出
        id: process_json
        env:
          MY_REPO: ${{ github.repository }}
        run: |
          python - << 'EOF'
          （你的原始 Python 代码保持不变）
          EOF

      - name: 2. 精准比对 GitHub 本地变更，使用中文时间和文件名格式化 Commit 提交
        id: diff_check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TASK_FILES="${{ steps.process_json.outputs.task_files }}"
          changed_files=()

          for file in $TASK_FILES; do
            if [ -f "$file" ]; then
              git add -f "$file"

              if [ -n "$(git status --porcelain "$file")" ]; then
                echo "🔍 [发现变更/新增] $file 与仓库记录不一致，加入待处理列表！"
                changed_files+=("$file")
              else
                echo "🙈 [无变更] $file 与已有版本一致，撤销暂存。"
                git restore --staged "$file" 2>/dev/null || true
              fi
            fi
          done

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "--------------------------------------------------"
            echo "🎉 【对比结果】所有 TASKS 文件内容无变动，自动跳过后续推送。"
            echo "--------------------------------------------------"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git rm --cached *.bin *.BIN 2>/dev/null || true

          NOW_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          changed_str=$(IFS=, ; echo "${changed_files[*]}")

          git commit -m "更新于 ${NOW_TIME} (变动文件: ${changed_str}) [skip ci]"
          git push
          echo "✅ 已成功向 GitHub 仓库提交变更文件: ${changed_str}"

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changed_files=${changed_files[*]}" >> $GITHUB_OUTPUT
          echo "commit_time=${NOW_TIME}" >> $GITHUB_OUTPUT

      - name: 3. 执行 tvbox.py 加密所有有变更/新增的文件
        id: encrypt_step
        if: steps.diff_check.outputs.has_changes == 'true'
        run: |
          if [ ! -f "scripts/tvbox.py" ]; then
            echo "❌ 错误：未找到 scripts/tvbox.py 脚本！"
            exit 1
          fi

          CHANGED_FILES="${{ steps.diff_check.outputs.changed_files }}"
          processed_json=()
          failed_files=()

          for target in $CHANGED_FILES; do
            if [ -f "$target" ]; then
              echo "正在加密文件: $target"
              base_name="${target%.*}"
              bin_file="${base_name}.bin"

              # ⭐ 使用新版 tvbox.py 调用格式
              python scripts/tvbox.py enc "$target" "$bin_file" || true

              if [ ! -f "$bin_file" ]; then
                echo "⚠️ [警告] 加密产物 $bin_file 未生成，跳过此文件并继续处理后续文件！"
                failed_files+=("$target")
              else
                echo "✅ 加密产物生成成功: $bin_file"
                processed_json+=("$target")
              fi
            fi
          done

          echo "--------------------------------------------------"
          echo "📊 【步骤 3 汇总】成功加密 ${#processed_json[@]} 个文件: $(IFS=, ; echo "${processed_json[*]}")"
          if [ ${#failed_files[@]} -gt 0 ]; then
            echo "⚠️ 加密失败的文件列表: $(IFS=, ; echo "${failed_files[*]}")"
          fi
          echo "--------------------------------------------------"

          if [ ${#processed_json[@]} -gt 0 ]; then
            echo "has_encrypted=true" >> $GITHUB_OUTPUT
            echo "encrypted_files=${processed_json[*]}" >> $GITHUB_OUTPUT
          else
            echo "has_encrypted=false" >> $GITHUB_OUTPUT
            echo "encrypted_files=" >> $GITHUB_OUTPUT
            echo "⚠️ [提示] 无任何文件成功生成加密产物，将跳过 Gitee 推送步骤。"
          fi

      - name: 4. 配置 SSH 与 Gitee 域名映射
        if: steps.diff_check.outputs.has_changes == 'true' && steps.encrypt_step.outputs.has_encrypted == 'true'
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat >> ~/.ssh/config <<EOF
          Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
          EOF

      - name: 5. 推送加密产物到 Gitee 的 mybox/json/ 目录
        if: steps.encrypt_step.outputs.has_encrypted == 'true'
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          echo "🔧 克隆 Gitee 仓库 mybox..."
          git clone git@gitee.com:child9527/mybox.git gitee_temp
          cd gitee_temp

          echo "📦 处理加密产物（.bin → .json）并推送到 json/ 目录..."

          mkdir -p json

          for file in ${{ steps.encrypt_step.outputs.encrypted_files }}; do
            base_name="$(basename "$file" .json)"
            bin_file="../json/${base_name}.bin"
            target_json="json/${base_name}.json"

            if [ -f "$bin_file" ]; then
              echo "🔄 加密产物重命名: ${bin_file} → ${target_json}"
              cp "$bin_file" "$target_json"
              rm -f "$bin_file"
            else
              echo "⚠️ 未找到加密产物: $bin_file"
            fi
          done

          git add json/*.json || true

          if [ -n "$(git.status --porcelain json)" ]; then
            NOW_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "同步加密 JSON 到 Gitee json/ 目录 (${NOW_TIME}) [skip ci]"
            git push origin master
            echo "🚀 已成功推送到 Gitee 的 mybox/json/ 目录！（加密后的 JSON）"
          else
            echo "🙈 没有需要推送到 Gitee 的 json 文件。"
          fi
