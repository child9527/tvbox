name: 批量同步、加密与双端推送

on:
  schedule:
    - cron: '0 17 * * *'   # 北京时间每天凌晨 01:00 运行
  workflow_dispatch:
  push:
    paths:
      - "task/task.json"
      - "json/**"

# 全局环境变量：强制所有 Step 及 Python 脚本环境统一使用北京时间
env:
  TZ: Asia/Shanghai

jobs:
  sync:
    name: 设置与同步任务
    runs-on: ubuntu-latest

    steps:
      - name: 拉取 GitHub 仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 及依赖环境
        run: |
          python -m pip install --upgrade pip
          pip install requests commentjson pycryptodome

      - name: 步骤 1 - 执行同步脚本获取文件清单
        id: sync_json
        run: |
          python scripts/sync.py

      - name: 步骤 2 - 检查文件差异并更新 GitHub 状态
        id: diff_check
        env:
          GITEE_API_URL: "https://gitee.com/api/v5/repos/child9527/mybox/contents/json"
          DELETED_FILES: "${{ steps.sync_json.outputs.deleted_files }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          changed_files=()

          echo "🔍 检查 GitHub 本地是否有变化..."
          
          # 如果有被删除的文件，在 Git 中记录删除状态
          if [ -n "$DELETED_FILES" ]; then
            for df in $DELETED_FILES; do
              if [ -f "json/$df" ]; then
                git rm -f "json/$df" || true
              fi
            done
          fi

          # 1. 暂存所有 json 变动以及 task/task.json 变动
          git add -A json/ task/task.json

          # 检查 json/*.json 是否有更新
          for file in json/*.json; do
            if [ -n "$(git status --porcelain "$file")" ]; then
              echo "📌 本地 json 变更: $file"
              changed_files+=("$file")
            fi
          done

          echo "🌐 从 Gitee API 获取 json 目录文件列表..."
          gitee_json_list=$(curl -s "$GITEE_API_URL" | jq -r '.[].name?' 2>/devnull || true)

          echo "📁 Gitee 现有文件:"
          echo "$gitee_json_list"

          echo "🔎 检查 Gitee 是否缺少文件..."
          for file in json/*.json; do
            base="$(basename "$file")"
            if ! echo "$gitee_json_list" | grep -q "^$base$"; then
              echo "📌 Gitee 缺少: $base → 强制加入 changed_files"
              if [[ ! " ${changed_files[*]} " =~ " ${file} " ]]; then
                changed_files+=("$file")
              fi
            fi
          done

          # 2. 提交并推送到 GitHub 仓库
          has_git_changes=false
          if [ -n "$(git status --porcelain)" ]; then
            has_git_changes=true
            
            SYNC_TIME=$(jq -r '.[0].timestamp // empty' task/task.json 2>/devnull || date +'%Y-%m-%d %H:%M:%S')
            
            git commit -m "更新于 ${SYNC_TIME} [skip ci]"
            
            # 拉取远程最新变更并变基，防止 push 被拒绝
            git pull --rebase origin main
            git push origin main
          fi

          # 如果既没有 git 变更，且 Gitee 无缺失也不需要删除操作，则退出
          if [ ${#changed_files[@]} -eq 0 ] && [ "$has_git_changes" = "false" ] && [ -z "$DELETED_FILES" ]; then
            echo "🎉 无需处理：本地无变化、Gitee 无缺失且无删除项"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changed_files=${changed_files[*]}" >> $GITHUB_OUTPUT
          echo "deleted_files=$DELETED_FILES" >> $GITHUB_OUTPUT

      - name: 步骤 3 - 执行 JSON 批量加密
        id: encrypt_step
        if: steps.diff_check.outputs.has_changes == 'true'
        run: |
          CHANGED="${{ steps.diff_check.outputs.changed_files }}"
          processed=()

          for f in $CHANGED; do
            if [ -f "$f" ]; then
              base="${f%.*}"
              bin="${base}.bin"
              python scripts/tvbox.py "$f" "$bin" enc || true
              if [ -f "$bin" ]; then
                processed+=("$f")
              fi
            fi
          done

          if [ ${#processed[@]} -gt 0 ]; then
            echo "has_encrypted=true" >> $GITHUB_OUTPUT
            echo "encrypted_files=${processed[*]}" >> $GITHUB_OUTPUT
          else
            echo "has_encrypted=false" >> $GITHUB_OUTPUT
          fi

      - name: 步骤 4 - 配置 Gitee SSH 密钥传输认证
        if: steps.diff_check.outputs.has_changes == 'true'
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no" >> ~/.ssh/config

      - name: 步骤 5 - 部署加密/删除变更至 Gitee 仓库
        if: steps.diff_check.outputs.has_changes == 'true'
        env:
          DELETED_FILES: "${{ steps.diff_check.outputs.deleted_files }}"
        run: |
          # 使用 --depth 1 浅克隆加速
          git clone --depth 1 git@gitee.com:child9527/mybox.git gitee_temp
          cd gitee_temp

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p json

          # 1. 处理新增/覆盖加密文件
          for f in ${{ steps.encrypt_step.outputs.encrypted_files }}; do
            base="$(basename "$f" .json)"
            if [ -f "../json/${base}.bin" ]; then
              cp "../json/${base}.bin" "json/${base}.json"
              rm -f "../json/${base}.bin"
            fi
          done

          # 2. 处理需要从 Gitee 删掉的文件
          if [ -n "$DELETED_FILES" ]; then
            for df in $DELETED_FILES; do
              if [ -f "json/$df" ]; then
                echo "🗑️ 正在从 Gitee 删除: json/$df"
                git rm -f "json/$df" || rm -f "json/$df"
              fi
            done
          fi

          # 3. 暂存所有变更
          git add -A json/

          # 4. 检查 Gitee 工作区是否有变更并推送
          if [ -n "$(git status --porcelain)" ]; then
            SYNC_TIME=$(jq -r '.[0].timestamp // empty' ../task/task.json 2>/devnull || date +'%Y-%m-%d %H:%M:%S')
            git commit -m "同步加密 JSON 与删除变更 (${SYNC_TIME}) [skip ci]"
            
            git push origin master
            echo "✅ 成功更新至 Gitee！"
          else
            echo "🎉 Gitee 侧无任何变动，跳过推送"
          fi
