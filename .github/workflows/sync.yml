name: 批量同步、加密与双端推送 (GitHub + Gitee)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch-sync-and-encrypt:
    name: 批量处理、加密及推送
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome commentjson

      - name: 1. 多文件拉取、精简剔除注释行、JSON 格式统一校验与导出
        id: process_json
        env:
          MY_REPO: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import time
          import sys
          from concurrent.futures import ThreadPoolExecutor
          import requests
          import commentjson

          my_repo = os.environ.get('MY_REPO')
          raw_github_prefix = "https://raw.githubusercontent.com/"

          # 支持在此自由增删 JSON 任务（既支持 GitHub 链接，也支持普通 HTTP/HTTPS 链接）
          TASKS = [
              {
                  "name": "x.json",
                  "url": "https://github.com/alantang1977/X/blob/main/X.json"
              },
              {
                  "name": "jsm.json",
                  "url": "https://github.com/qist/tvbox/blob/master/jsm.json"
              },
              {
                  "name": "pj.json",
                  "url": "https://github.com/mcp2016/TVBox/blob/main/pj.json"
              },
              {
                  "name": "api.json",
                  "url": "https://yydsok.com/api/bendi/yydsapi/nf/api.json"
              }
          ]

          MIRRORS = [
              "https://github.moeyy.xyz/",
              "https://gh-proxy.org/",
              "https://ghproxy.net/",
              "https://mirror.ghproxy.com/",
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          def is_github_url(url):
              """判断是否为 GitHub 相关的链接"""
              return "github.com" in url or "raw.githubusercontent.com" in url

          def normalize_to_raw_url(url):
              """如果是 GitHub 仓库链接，规范化转换为 raw 链接；非 GitHub 链接保持原样"""
              if is_github_url(url):
                  url = re.sub(r'https://github\.com/([^/]+)/([^/]+)/blob/([^/]+)/(.*)', r'https://raw.githubusercontent.com/\1/\2/\3/\4', url)
                  url = url.replace('/refs/heads/', '/')
              return url

          def get_base_url(url):
              """根据任务 URL 获取其资源的基础目录 (Base URL)"""
              raw_url = normalize_to_raw_url(url)
              if "/" in raw_url:
                  return raw_url.rsplit("/", 1)[0] + "/"
              return raw_url

          def force_remove_comments(text):
              text = text.replace('\r', '')
              text = re.sub(r'/\*[\s\S]*?\*/', '', text)
              
              clean_lines = []
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped.startswith('//') or stripped.startswith('#'):
                      continue
                  clean_lines.append(line)
              
              cleaned_text = "\n".join(clean_lines)
              cleaned_text = re.sub(r',\s*([\}\]])', r'\1', cleaned_text)
              return cleaned_text

          def test_mirror(mirror):
              test_url = mirror + raw_github_prefix + "alantang1977/X/main/X.json"
              try:
                  start = time.time()
                  r = requests.get(test_url, headers=HEADERS, timeout=4)
                  text = r.content.decode("utf-8", errors="ignore").lstrip()
                  if r.status_code == 200 and (text.startswith("{") or text.startswith("[") or text.startswith("//")):
                      return mirror, time.time() - start
              except Exception:
                  pass
              return mirror, None

          # 测速选择全局最快 GitHub 镜像
          results = {}
          with ThreadPoolExecutor(max_workers=len(MIRRORS)) as executor:
              futures = [executor.submit(test_mirror, m) for m in MIRRORS]
              for future in futures:
                  m, delay = future.result()
                  if delay is not None:
                      results[m] = delay

          sorted_mirrors = sorted(results, key=results.get) if results else MIRRORS
          accent_prefix = sorted_mirrors[0] if sorted_mirrors else "https://gh-proxy.org/"
          print(f"全局最快 GitHub 镜像: {accent_prefix}\n")

          def process_url(url, base_url):
              """
              正确修补相对路径与 GitHub 镜像：
              1. 相对路径 (./) -> 补全为原作者的 Base URL，而非你自己的仓库地址
              2. 参数（如 ;md5;xxx） -> 保持在链接末尾
              3. GitHub 链接 -> 加上镜像代理
              4. 普通网络链接 -> 保持原样
              """
              if not isinstance(url, str):
                  return url
              
              # 如果包含以 ./ 开头的相对路径，替换为任务原作者的 Base URL
              if "./" in url:
                  # 分离可能存在的参数（如 ;md5;xxxx）
                  extra_param = ""
                  clean_url = url
                  if ";" in url:
                      parts = url.split(";", 1)
                      clean_url = parts[0]
                      extra_param = ";" + parts[1]

                  # 替换其中的 ./ 为原作者 Base URL
                  if clean_url.startswith("./"):
                      clean_url = base_url + clean_url[2:]
                  elif "./" in clean_url:
                      clean_url = re.sub(r'\./', base_url, clean_url)

                  url = clean_url + extra_param

              # 如果处理后的链接是 GitHub 资源，加上镜像前缀加速
              if is_github_url(url):
                  # 避免重复加镜像
                  for mirror in MIRRORS:
                      if url.startswith(mirror):
                          return url
                  raw_url = normalize_to_raw_url(url)
                  # 如果链接中包含 ;md5; 等参数，前缀只加到真实 url 前面
                  if ";" in raw_url:
                      u_parts = raw_url.split(";", 1)
                      return f"{accent_prefix}{u_parts[0]};{u_parts[1]}"
                  return f"{accent_prefix}{raw_url}"

              # 非 GitHub 链接保持原样
              return url

          def traverse_and_replace(data, base_url):
              if isinstance(data, dict):
                  return {k: traverse_and_replace(v, base_url) for k, v in data.items()}
              elif isinstance(data, list):
                  return [traverse_and_replace(item, base_url) for item in data]
              elif isinstance(data, str):
                  return process_url(data, base_url)
              else:
                  return data

          successful_files = []
          total_tasks = len(TASKS)

          for task in TASKS:
              save_filename = task["name"]
              target_url = task["url"]
              task_base_url = get_base_url(target_url)
              
              resp_content = None

              # 分流拉取：判断是 GitHub 链接还是普通 HTTP 链接
              if is_github_url(target_url):
                  raw_target_url = normalize_to_raw_url(target_url)
                  for mirror in sorted_mirrors:
                      fetch_url = f"{mirror}{raw_target_url}"
                      try:
                          resp = requests.get(fetch_url, headers=HEADERS, timeout=8)
                          if resp.status_code == 200:
                              text = resp.content.decode("utf-8", errors="ignore").replace("\ufeff", "").strip()
                              if text:
                                  resp_content = text
                                  print(f"--> 从 GitHub 镜像 {mirror} 成功获取: {save_filename}")
                                  break
                      except Exception:
                          continue
              else:
                  # 普通第三方 URL（如 yydsok.com），直接拉取
                  try:
                      resp = requests.get(target_url, headers=HEADERS, timeout=10)
                      if resp.status_code == 200:
                          text = resp.content.decode("utf-8", errors="ignore").replace("\ufeff", "").strip()
                          if text:
                              resp_content = text
                              print(f"--> 直接从第三方 URL 成功获取: {save_filename} ({target_url})")
                  except Exception as e:
                      print(f"❌ 拉取第三方 URL 失败 ({target_url}): {e}")

              if not resp_content:
                  print(f"❌ 错误：无法拉取内容: {save_filename}")
                  if not os.path.exists(save_filename):
                      sys.exit(1)
                  else:
                      print(f"⚠️ 保留本地已存在的旧版 {save_filename}")
                      successful_files.append(save_filename)
                      continue

              cleaned_text = force_remove_comments(resp_content)

              json_obj = None
              try:
                  json_obj = commentjson.loads(cleaned_text)
              except Exception:
                  pass

              if json_obj is None:
                  # 如果 commentjson 严格解析失败，尝试文本行处理
                  lines = cleaned_text.splitlines()
                  new_lines = []
                  for line in lines:
                      # 替换 ./ 相对路径为原作者的 base_url
                      line = re.sub(r'(["\'])(\./)([^"\']+)(["\'])', r'\1' + task_base_url + r'\3\4', line)
                      # 针对 github raw 链接增加镜像代理
                      if is_github_url(line) and not any(m in line for m in MIRRORS):
                          line = re.sub(r'(?<!/)(["\'])(https://raw\.githubusercontent\.com/[^"\']+)(["\'])', r'\1' + accent_prefix + r'\2\3', line)
                      new_lines.append(line)

                  final_clean_text = "\n".join(new_lines)
                  final_clean_text = re.sub(r',\s*([\}\]])', r'\1', final_clean_text)

                  try:
                      json_obj = json.loads(final_clean_text)
                  except Exception:
                      json_obj = None

              if json_obj is not None:
                  # 遍历递归修补相对路径与代理
                  processed_data = traverse_and_replace(json_obj, task_base_url)
                  
                  final_json_str = json.dumps(processed_data, ensure_ascii=False, indent=2)
                  json.loads(final_json_str)

                  with open(save_filename, "w", encoding="utf-8") as f:
                      f.write(final_json_str)
                  
                  print(f"✅ 校验通过：完美导出无注释合法 JSON -> {save_filename}\n")
                  successful_files.append(save_filename)
              else:
                  print(f"❌ 校验失败：{save_filename} 去注释后的内容并非合法 JSON，放弃写入！")
                  if os.path.exists(save_filename):
                      print(f"⚠️ 保留旧版文件: {save_filename}")
                      successful_files.append(save_filename)

          print("--------------------------------------------------")
          print(f"📊 【步骤 1 统计】任务总数: {total_tasks} | 成功处理: {len(successful_files)}")
          print(f"📄 文件列表: {', '.join(successful_files)}")
          print("--------------------------------------------------\n")

          # 将 TASKS 中的目标文件名导出给后续步骤
          task_files_str = " ".join([t["name"] for t in TASKS])
          github_output = os.environ.get('GITHUB_OUTPUT')
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"task_files={task_files_str}\n")
          EOF

      - name: 2. 仅提交 TASKS 列表中对应的明文 JSON 到 GitHub 仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TASK_FILES="${{ steps.process_json.outputs.task_files }}"

          for file in $TASK_FILES; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          git rm --cached *.bin *.BIN 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "提示：GitHub 仓库的 TASKS JSON 无实际变动，跳过 Commit。"
          else
            git commit -m "auto: update plain json files without comments [skip ci]"
            git push
            echo "✅ 已成功推送 TASKS 里的无注释明文 JSON 到 GitHub 仓库！"
          fi

      - name: 3. 执行 tvbox.py 仅加密 TASKS 里的 JSON 文件
        id: encrypt_step
        run: |
          if [ ! -f "tvbox.py" ]; then
            echo "❌ 错误：根目录下未找到 tvbox.py 脚本！"
            exit 1
          fi

          TASK_FILES="${{ steps.process_json.outputs.task_files }}"
          processed_json=()
          
          for target in $TASK_FILES; do
            if [ -f "$target" ]; then
              echo "正在加密无注释文件: $target"
              base_name="${target%.*}"
              bin_file="${base_name}.bin"

              python tvbox.py "$target" "$bin_file" enc

              if [ ! -f "$bin_file" ]; then
                echo "❌ 失败：加密产物 $bin_file 未成功生成！"
                exit 1
              else
                echo "✅ 加密产物已成功生成: $bin_file"
                processed_json+=("$target")
              fi
            else
              echo "⚠️ 警告：未找到目标文件 $target，跳过加密。"
            fi
          done

          if [ ${#processed_json[@]} -eq 0 ]; then
            echo "❌ 失败：未成功加密任何 TASKS 里的 .json 文件，中断执行！"
            exit 1
          fi

          echo "--------------------------------------------------"
          echo "📊 【步骤 3 汇总】成功加密 ${#processed_json[@]} 个 TASKS 目标文件: $(IFS=, ; echo "${processed_json[*]}")"
          echo "--------------------------------------------------"

      - name: 4. 配置 SSH 与 Gitee 域名映射
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s\n" "$SSH_KEY" > ~/.ssh/gitee_id_ed25519
          chmod 600 ~/.ssh/gitee_id_ed25519

          cat << 'EOF' > ~/.ssh/config
          Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/gitee_id_ed25519
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config
          ssh -T git@gitee.com || true

      - name: 5. 克隆 Gitee mybox 仓库并动态推送 TASKS 加密产物
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "[提示] 开始克隆 Gitee mybox 仓库..."
          git clone git@gitee.com:child9527/mybox.git gitee_temp

          cd gitee_temp
          git rm -f *.bin *.BIN 2>/dev/null || true
          cd ..

          TASK_FILES="${{ steps.process_json.outputs.task_files }}"
          copied_files=()

          for target in $TASK_FILES; do
            base_name="${target%.*}"
            bin_file="${base_name}.bin"
            
            if [ -f "$bin_file" ]; then
              target_name="${base_name}.json"
              echo "改名复制加密产物: $bin_file -> gitee_temp/$target_name"
              cp -v "$bin_file" "gitee_temp/$target_name"
              copied_files+=("$target_name")
            fi
          done

          if [ ${#copied_files[@]} -eq 0 ]; then
            echo "❌ 失败：未检测到任何 TASKS 相关的 .bin 加密产物，中断推送！"
            exit 1
          fi

          file_list_str=$(IFS=, ; echo "${copied_files[*]}")

          echo "--------------------------------------------------"
          echo "📊 【步骤 5 推送前汇总】准备向 Gitee 推送 ${#copied_files[@]} 个文件: $file_list_str"
          echo "--------------------------------------------------"

          cd gitee_temp
          git add -A

          if git diff --staged --quiet; then
            echo "[提示] Gitee 仓库无任何变更，跳过 Commit 和 Push。"
          else
            echo "[提示] 检测到变更，正在推送以下加密产物至 Gitee: $file_list_str"
            git commit -m "auto: update encrypted json files ($file_list_str) [skip ci]"
            git push origin HEAD
            echo "✅ [成功] 已成功向 Gitee mybox 推送文件: $file_list_str"
          fi

      - name: 6. 清理临时文件夹及所有 .bin 临时文件
        if: always()
        run: |
          rm -rf gitee_temp
          rm -f *.bin *.BIN
          rm -f .hash_cache.json
          echo "[完成] 所有临时加密文件已彻底清理。"
