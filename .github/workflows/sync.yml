name: 批量同步、加密与双端推送 (GitHub + Gitee)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch-sync-and-encrypt:
    name: 批量处理、加密及推送
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome commentjson jsmin

      - name: 1. 多文件拉取、精简剔除注释行、JSON 加速替换与导出
        id: process_json
        env:
          MY_REPO: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import time
          import sys
          from concurrent.futures import ThreadPoolExecutor
          import requests
          import commentjson

          my_repo = os.environ.get('MY_REPO')
          raw_github_prefix = "https://raw.githubusercontent.com/"

          TASKS = [
              {
                  "name": "x.json",
                  "url": "https://github.com/alantang1977/X/blob/main/X.json"
              },
              {
                  "name": "pj.json",
                  "url": "https://github.com/mcp2016/TVBox/blob/main/pj.json"
              }
          ]

          MIRRORS = [
              "https://github.moeyy.xyz/",
              "https://gh-proxy.org/",
              "https://ghproxy.net/",
              "https://mirror.ghproxy.com/",
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          def normalize_to_raw_url(url):
              url = re.sub(r'https://github\.com/([^/]+)/([^/]+)/blob/([^/]+)/(.*)', r'https://raw.githubusercontent.com/\1/\2/\3/\4', url)
              url = url.replace('/refs/heads/', '/')
              return url

          def force_remove_comments(text):
              """
              精简清洗逻辑：
              1. 剔除多行注释 /* ... */
              2. 忽略开头空格后，只要整行以 // 或 # 开头，直接整行过滤掉
              """
              # 剔除 Windows 回车符
              text = text.replace('\r', '')
              
              # 剔除多行注释
              text = re.sub(r'/\*[\s\S]*?\*/', '', text)
              
              clean_lines = []
              for line in text.splitlines():
                  stripped = line.strip()
                  # 开头是 // 或 # (包含前缀空格的情况) 的整行抛弃
                  if stripped.startswith('//') or stripped.startswith('#'):
                      continue
                  clean_lines.append(line)
              
              cleaned_text = "\n".join(clean_lines)
              cleaned_text = re.sub(r',\s*([\}\]])', r'\1', cleaned_text)
              return cleaned_text

          def test_mirror(mirror):
              test_url = mirror + raw_github_prefix + "alantang1977/X/main/X.json"
              try:
                  start = time.time()
                  r = requests.get(test_url, headers=HEADERS, timeout=4)
                  text = r.content.decode("utf-8", errors="ignore").lstrip()
                  if r.status_code == 200 and (text.startswith("{") or text.startswith("[") or text.startswith("//")):
                      return mirror, time.time() - start
              except Exception:
                  pass
              return mirror, None

          results = {}
          with ThreadPoolExecutor(max_workers=len(MIRRORS)) as executor:
              futures = [executor.submit(test_mirror, m) for m in MIRRORS]
              for future in futures:
                  m, delay = future.result()
                  if delay is not None:
                      results[m] = delay

          sorted_mirrors = sorted(results, key=results.get) if results else MIRRORS
          accent_prefix = sorted_mirrors[0]
          print(f"全局最快镜像: {accent_prefix}\n")

          my_repo_raw_base = f"{accent_prefix}{raw_github_prefix}{my_repo}/main/"

          def process_url(url):
              if not isinstance(url, str):
                  return url
              idx = url.find(raw_github_prefix)
              if idx > 0:
                  return url
              if url.startswith("./"):
                  return f"{my_repo_raw_base}{url[2:]}"
              if idx == 0:
                  return f"{accent_prefix}{url}"
              return url

          def traverse_and_replace(data):
              if isinstance(data, dict):
                  return {k: traverse_and_replace(v) for k, v in data.items()}
              elif isinstance(data, list):
                  return [traverse_and_replace(item) for item in data]
              elif isinstance(data, str):
                  return process_url(data)
              else:
                  return data

          for task in TASKS:
              save_filename = task["name"]
              raw_target_url = normalize_to_raw_url(task["url"])
              
              resp_content = None
              for mirror in sorted_mirrors:
                  fetch_url = f"{mirror}{raw_target_url}"
                  try:
                      resp = requests.get(fetch_url, headers=HEADERS, timeout=8)
                      if resp.status_code == 200:
                          text = resp.content.decode("utf-8", errors="ignore").replace("\ufeff", "").strip()
                          if text:
                              resp_content = text
                              print(f"--> 从镜像 {mirror} 成功获取原文件: {save_filename}")
                              break
                  except Exception:
                      continue

              if not resp_content:
                  print(f"❌ 错误：所有镜像均无法拉取内容: {save_filename}")
                  if not os.path.exists(save_filename):
                      sys.exit(1)
                  else:
                      print(f"⚠️ 保留本地已存在的旧版 {save_filename}")
                      continue

              cleaned_text = force_remove_comments(resp_content)

              json_data = None
              try:
                  json_data = commentjson.loads(cleaned_text)
              except Exception:
                  try:
                      json_data = json.loads(cleaned_text, strict=False)
                  except Exception:
                      pass

              if json_data is not None:
                  processed_data = traverse_and_replace(json_data)
                  with open(save_filename, "w", encoding="utf-8") as f:
                      json.dump(processed_data, f, ensure_ascii=False, indent=2)
                  print(f"✅ 成功完美解析并生成格式化的无注释 JSON: {save_filename}\n")
              else:
                  print(f"ℹ️ {save_filename} 结构化解析未成功，写入去注释后的文本...")
                  lines = cleaned_text.splitlines()
                  new_lines = []
                  for line in lines:
                      if re.search(r'https?://[^"\']+/https://raw\.githubusercontent\.com/', line):
                          new_lines.append(line)
                          continue
                      new_line = re.sub(r'(["\'])(\./)([^"\']+)(["\'])', r'\1' + my_repo_raw_base + r'\3\4', line)
                      new_line = re.sub(r'(?<!/)(["\'])(https://raw\.githubusercontent\.com/[^"\']+)(["\'])', r'\1' + accent_prefix + r'\2\3', new_line)
                      new_lines.append(new_line)

                  final_clean_text = "\n".join(new_lines)
                  final_clean_text = re.sub(r',\s*([\}\]])', r'\1', final_clean_text)

                  with open(save_filename, "w", encoding="utf-8") as f:
                      f.write(final_clean_text)
                  print(f"✅ 无注释纯文本保存完成: {save_filename}\n")
          EOF

      - name: 2. 优先提交无注释明文 JSON 到 GitHub 仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "X.json" ]; then
            git rm -f X.json 2>/dev/null || true
          fi

          git add -f x.json pj.json 2>/dev/null || true
          git rm --cached *.bin *.BIN 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "提示：GitHub 仓库的 JSON 无实际变动，跳过 Commit。"
          else
            git commit -m "auto: update plain json files without comments [skip ci]"
            git push
            echo "✅ 已优先成功推送无注释明文 JSON 到 GitHub 仓库！"
          fi

      - name: 3. 执行 tvbox.py 将无注释 JSON 加密为 BIN
        id: encrypt_step
        run: |
          if [ ! -f "tvbox.py" ]; then
            echo "❌ 错误：根目录下未找到 tvbox.py 脚本！"
            exit 1
          fi

          for target in "x.json" "pj.json"; do
            if [ -f "$target" ]; then
              echo "正在加密无注释文件: $target"
              base_name="${target%.*}"
              bin_file="${base_name}.bin"

              python tvbox.py "$target" "$bin_file" enc

              if [ ! -f "$bin_file" ]; then
                echo "❌ 失败：加密产物 $bin_file 未成功生成！"
                exit 1
              else
                echo "✅ 加密产物已成功生成: $bin_file"
              fi
            else
              echo "❌ 失败：未能找到待加密文件: $target"
              exit 1
            fi
          done

      - name: 4. 配置 SSH 与 Gitee 域名映射
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s\n" "$SSH_KEY" > ~/.ssh/gitee_id_ed25519
          chmod 600 ~/.ssh/gitee_id_ed25519

          cat << 'EOF' > ~/.ssh/config
          Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/gitee_id_ed25519
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config
          ssh -T git@gitee.com || true

      - name: 5. 克隆 Gitee mybox 仓库并推送加密改名后的 JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "[提示] 开始克隆 Gitee mybox 仓库..."
          git clone git@gitee.com:child9527/mybox.git gitee_temp

          cd gitee_temp
          git rm -f *.bin *.BIN 2>/dev/null || true
          cd ..

          for b in "x.bin" "pj.bin"; do
            if [ -f "$b" ]; then
              target_name="${b%.*}.json"
              echo "改名复制加密产物: $b -> gitee_temp/$target_name"
              cp -v "$b" "gitee_temp/$target_name"
            else
              echo "❌ 失败：缺少加密文件 $b，中断推送！"
              exit 1
            fi
          done

          cd gitee_temp
          git add -A

          if git diff --staged --quiet; then
            echo "[提示] Gitee 仓库无任何变更，跳过 Commit 和 Push。"
          else
            echo "[提示] 检测到变更，提交并推送加密产物至 Gitee..."
            git push origin HEAD
            echo "[成功] 加密产物 (x.json, pj.json) 已同步更新至 Gitee mybox！"
          fi

      - name: 6. 清理临时文件夹及所有 .bin 临时文件
        if: always()
        run: |
          rm -rf gitee_temp
          rm -f *.bin *.BIN
          rm -f .hash_cache.json
          echo "[完成] 所有临时加密文件已彻底清理。"
