name: one&mtv6&yoursmile66自动解密并同步接口文件

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  decrypt_and_commit:
    name: one加密、mtv6下载及推送
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 执行核心调度逻辑
        id: process_logic
        run: |
          python - << 'EOF'
          import os, time, random, sys, urllib.request

          targets = [
              {
                  "name": "one",
                  "url": "https://9877.kstore.space/one.json",
                  "local": "json/one.json",
                  "decrypt": True
              },
              {
                  "name": "mtv6",
                  "url": "https://d.kstore.dev/download/2843/mtv6.txt",
                  "local": "json/mtv6.json",
                  "decrypt": False
              }
          ]

          STATE_FILE = "task/next_run.txt"
          current_time = int(time.time())

          # 读取原文件所有行
          lines = []
          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  lines = f.read().splitlines()

          # 确保至少有两行
          while len(lines) < 2:
              lines.append("")

          # 第 1 行：下一次运行时间
          try:
              target_time = int(lines[0].strip()) if lines[0].strip() else 0
          except:
              target_time = 0

          # 第 2 行：TAB 分隔的 name:size
          size_map = {}
          if lines[1].strip():
              for p in lines[1].split("\t"):
                  if ":" in p:
                      name, size = p.split(":", 1)
                      size_map[name] = size

          # 判断首次运行
          is_first_run = (not os.path.exists(STATE_FILE))
          for t in targets:
              if not os.path.exists(t["local"]):
                  is_first_run = True

          # 打印当前时间与下一次运行时间（UTC + 北京时间）
          import datetime

          utc_now = datetime.datetime.utcnow()
          bj_now = utc_now + datetime.timedelta(hours=8)

          try:
              target_ts = int(lines[0].strip()) if lines[0].strip() else 0
          except:
              target_ts = 0

          target_utc = datetime.datetime.utcfromtimestamp(target_ts)
          target_bj = target_utc + datetime.timedelta(hours=8)

          print("==============================================")
          print(f"当前时间（UTC）: {utc_now.strftime('%Y-%m-%d %H:%M:%S')}")
          print(f"当前时间（北京时间）: {bj_now.strftime('%Y-%m-%d %H:%M:%S')}")
          print(f"下一次运行时间（UTC）: {target_utc.strftime('%Y-%m-%d %H:%M:%S')}")
          print(f"下一次运行时间（北京时间）: {target_bj.strftime('%Y-%m-%d %H:%M:%S')}")
          print("==============================================")
          print(f"是否进入执行阶段: {'是' if (is_first_run or current_time >= target_ts) else '否'}")
          print("==============================================")

          # 时间未到 → 退出
          if not is_first_run and current_time < target_time:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  for t in targets:
                      if t["decrypt"]:
                          f.write(f"should_decrypt_{t['name']}=false\n")
                      else:
                          f.write(f"should_download_{t['name']}=false\n")
              sys.exit(0)

          print(">> 时间已到/首次运行，开始伪装 TVBox HEAD 请求...")

          headers = {
              "User-Agent": "okhttp/3.12.0",
              "Accept": "*/*",
              "Connection": "Keep-Alive"
          }

          results = {}
          for t in targets:
              local_size = size_map.get(t["name"], "")
              remote_size = ""
              try:
                  req = urllib.request.Request(t["url"], headers=headers, method="HEAD")
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      remote_size = resp.headers.get("Content-Length", "").strip()
              except Exception as e:
                  print(f"[{t['name']}] HEAD 请求失败: {e}")

              need = is_first_run or (remote_size and remote_size != local_size)
              results[t["name"]] = {
                  "need": need,
                  "size": remote_size if remote_size else local_size,
                  "decrypt": t["decrypt"],
                  "url": t["url"],
                  "local": t["local"]
              }

          # 更新前两行，保留第 3 行及以后
          random_delay = random.randint(24 * 3600, 72 * 3600)
          next_target_time = current_time + random_delay
          size_line = "\t".join([f"{name}:{results[name]['size']}" for name in results])

          lines[0] = str(next_target_time)
          lines[1] = size_line

          with open(STATE_FILE, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          # 输出标志
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for t in targets:
                  if t["decrypt"]:
                      f.write(f"should_decrypt_{t['name']}={'true' if results[t['name']]['need'] else 'false'}\n")
                  else:
                      f.write(f"should_download_{t['name']}={'true' if results[t['name']]['need'] else 'false'}\n")
          EOF

      - name: 解密 one.json
        if: steps.process_logic.outputs.should_decrypt_one == 'true'
        run: |
          python scripts/tvbox.py "https://9877.kstore.space/one.json" "json/one.json" dec

      - name: 下载 mtv6.json（明文）
        if: steps.process_logic.outputs.should_download_mtv6 == 'true'
        run: |
          curl -L "https://d.kstore.dev/download/2843/mtv6.txt" -o "json/mtv6.json"

      - name: 解密 YourSmile66.json（每次定时器必执行）
        run: |
          echo "开始解密 YourSmile66.json ..."
          python scripts/tvbox.py \
            "https://github.com/yoursmile66/TVBox/raw/refs/heads/main/XC.json" \
            "json/YourSmile66.json" \
            dec

      - name: 提交改动
        run: |
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          git add task/next_run.txt json/one.json json/mtv6.json json/YourSmile66.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto Sync: 更新于 $BEIJING_TIME"
            git push
          else
            echo "没有文件发生改动，无需 Push。"
          fi

