name: Auto Sync TVBox

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run process logic
        id: logic
        run: |
          mkdir -p task json

          python - << 'EOF'
import os, time, random, sys, urllib.request
import datetime

targets = [
    {
        "name": "one",
        "url": "https://9877.kstore.space/one.json",
        "local": "json/one.json",
        "decrypt": True
    },
    {
        "name": "yoursmile66",
        "url": "https://github.com/yoursmile66/TVBox/raw/main/XC.json",
        "local": "json/yoursmile66.json",
        "decrypt": True
    },
    {
        "name": "mtv6",
        "url": "https://d.kstore.dev/download/2843/mtv6.txt",
        "local": "json/mtv6.json",
        "decrypt": False
    }
]

STATE_FILE = "task/next_run.txt"
current_time = int(time.time())

# 读取 next_run.txt
lines = []
if os.path.exists(STATE_FILE):
    with open(STATE_FILE, "r", encoding="utf-8") as f:
        lines = f.read().splitlines()

# ⭐ 确保至少有三行（第3行用于 xc_last_date）
while len(lines) < 3:
    lines.append("")

# 第 1 行：下一次运行时间戳
try:
    target_time = int(lines[0].strip()) if lines[0].strip() else 0
except:
    target_time = 0

# 第 2 行：size_map
size_map = {}
if lines[1].strip():
    for p in lines[1].split("\t"):
        if ":" in p:
            name, size = p.split(":", 1)
            size_map[name] = size

# 判断首次运行
is_first_run = (not os.path.exists(STATEFILE))
for t in targets:
    if not os.path.exists(t["local"]):
        is_first_run = True

# 打印时间信息
utc_now = datetime.datetime.utcnow()
bj_now = utc_now + datetime.timedelta(hours=8)

target_utc = datetime.datetime.utcfromtimestamp(target_time)
target_bj = target_utc + datetime.timedelta(hours=8)

print("==============================================")
print(f"当前时间（UTC）: {utc_now.strftime('%Y-%m-%d %H:%M:%S')}")
print(f"当前时间（北京时间）: {bj_now.strftime('%Y-%m-%d %H:%M:%S')}")
print(f"下一次运行时间（UTC）: {target_utc.strftime('%Y-%m-%d %H:%M:%S')}")
print(f"下一次运行时间（北京时间）: {target_bj.strftime('%Y-%m-%d %H:%M:%S')}")
print("==============================================")
print(f"是否进入执行阶段: {'是' if (is_first_run or current_time >= target_time) else '否'}")
print("==============================================")

# ⭐ 时间未到 → one / mtv6 不执行，但 XC 仍然要判断
if not is_first_run and current_time < target_time:
    with open(os.environ["GITHUB_OUTPUT"], "a") as f:
        for t in targets:
            name = t["name"]

            if name == "yoursmile66":
                # ⭐ XC 每天一次 + 文件大小变化判断
                xc_last_date = ""
                if lines[2].startswith("xc_last_date="):
                    xc_last_date = lines[2].split("=", 1)[1].strip()

                today = bj_now.strftime("%Y-%m-%d")

                remote_size = ""
                try:
                    req = urllib.request.Request(t["url"], headers={
                        "User-Agent": "okhttp/3.12.0",
                        "Accept": "*/*",
                        "Connection": "Keep-Alive"
                    }, method="HEAD")
                    with urllib.request.urlopen(req, timeout=12) as resp:
                        remote_size = resp.headers.get("Content-Length", "").strip()
                except:
                    pass

                local_size = size_map.get("yoursmile66", "")
                size_changed = (remote_size and remote_size != local_size)

                need = (today != xc_last_date) and size_changed

                if need:
                    lines[2] = f"xc_last_date={today}"

                f.write(f"should_decrypt_yoursmile66={'true' if need else 'false'}\n")

            else:
                if t["decrypt"]:
                    f.write(f"should_decrypt_{name}=false\n")
                else:
                    f.write(f"should_download_{name}=false\n")

    with open(STATE_FILE, "w", encoding="utf-8") as f:
        f.write("\n".join(lines) + "\n")

    sys.exit(0)

print(">> 时间已到/首次运行，开始伪装 TVBox HEAD 请求...")

headers = {
    "User-Agent": "okhttp/3.12.0",
    "Accept": "*/*",
    "Connection": "Keep-Alive"
}

results = {}
for t in targets:
    name = t["name"]
    local_size = size_map.get(name, "")
    remote_size = ""

    try:
        req = urllib.request.Request(t["url"], headers=headers, method="HEAD")
        with urllib.request.urlopen(req, timeout=12) as resp:
            remote_size = resp.headers.get("Content-Length", "").strip()
    except Exception as e:
        print(f"[{name}] HEAD 请求失败: {e}")

    if name == "yoursmile66":
        xc_last_date = ""
        if lines[2].startswith("xc_last_date="):
            xc_last_date = lines[2].split("=", 1)[1].strip()

        today = bj_now.strftime("%Y-%m-%d")
        size_changed = (remote_size and remote_size != local_size)

        need = (today != xc_last_date) and size_changed

        if need:
            lines[2] = f"xc_last_date={today}"

    else:
        need = is_first_run or (remote_size and remote_size != local_size)

    results[name] = {
        "need": need,
        "size": remote_size if remote_size else local_size,
        "decrypt": t["decrypt"],
        "url": t["url"],
        "local": t["local"]
    }

random_delay = random.randint(24 * 3600, 72 * 3600)
next_target_time = current_time + random_delay
size_line = "\t".join([f"{name}:{results[name]['size']}" for name in results])

lines[0] = str(next_target_time)
lines[1] = size_line

with open(STATE_FILE, "w", encoding="utf-8") as f:
    f.write("\n".join(lines) + "\n")

with open(os.environ["GITHUB_OUTPUT"], "a") as f:
    for t in targets:
        name = t["name"]
        if t["decrypt"]:
            f.write(f"should_decrypt_{name}={'true' if results[name]['need'] else 'false'}\n")
        else:
            f.write(f"should_download_{name}={'true' if results[name]['need'] else 'false'}\n")

EOF

      - name: Decrypt JSON
        if: steps.logic.outputs.should_decrypt_one == 'true' || steps.logic.outputs.should_decrypt_yoursmile66 == 'true'
        run: |
          echo "解密 JSON..."

      - name: Download TXT
        if: steps.logic.outputs.should_download_mtv6 == 'true'
        run: |
          echo "下载 TXT..."

      - name: Commit changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Auto Sync" || echo "No changes"
          git push