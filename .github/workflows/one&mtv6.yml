name: 解密one&yoursmile66并推送

on:
  #schedule:
  #  - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run sync logic
        run: |
          mkdir -p task json

          python - << 'EOF'
          import os, urllib.request, subprocess

          tasks = [
              {"name": "one", "url": "https://9877.kstore.space/one.json"},
              {"name": "yoursmile66", "url": "https://github.com/yoursmile66/TVBox/raw/main/XC.json"},
              {"name": "mtv6", "url": "https://d.kstore.dev/download/2843/mtv6.txt"}
          ]

          headers = {"User-Agent": "okhttp/3.12.0", "Accept": "*/*", "Connection": "Keep-Alive"}
          state_file = "task/filesize.txt"

          # 读取上次记录的大小
          size_map = {}
          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  for line in f:
                      if ":" in line:
                          name, size = line.strip().split(":", 1)
                          size_map[name] = size

          new_size_map = {}

          for t in tasks:
              name = t["name"]
              url = t["url"]
              local_file = f"json/{name}.json"
              tmp_file = f"task/{name}.tmp"

              try:
                  req = urllib.request.Request(url, headers=headers, method="HEAD")
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      remote_size = resp.headers.get("Content-Length", "").strip()
              except Exception as e:
                  print(f"[{name}] 获取失败: {e}, 跳过")
                  continue

              last_size = size_map.get(name, "")
              new_size_map[name] = remote_size

              if remote_size and remote_size != last_size:
                  print(f"[{name}] 文件大小变化 → 执行任务")

                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          data = resp.read()

                      # 保存临时文件
                      with open(tmp_file, "wb") as f:
                          f.write(data)

                      # 调用 tvbox.py 自动识别模式（自动解密或直接保存）
                      subprocess.run(
                          ["python", "scripts/tvbox.py", tmp_file, local_file],
                          check=False
                      )

                      print(f"[{name}] 已保存到 {local_file}")

                      # 删除临时文件
                      if os.path.exists(tmp_file):
                          os.remove(tmp_file)

                  except Exception as e:
                      print(f"[{name}] 下载或处理失败: {e}, 跳过")
                      continue
              else:
                  print(f"[{name}] 文件大小未变化 → 跳过")

          # 更新文件大小记录
          with open(state_file, "w", encoding="utf-8") as f:
              for k, v in new_size_map.items():
                  f.write(f"{k}:{v}\n")
          EOF

      - name: Commit changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add json/*.json task/filesize.txt || echo "No files"
          git commit -m "Auto Sync" || echo "No changes"
          git push
