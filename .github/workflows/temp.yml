name: Temp Sync Leevi & Push

on:
  workflow_dispatch:

jobs:
  temp-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests commentjson pycryptodome

      - name: 只重置 leevi 的 MD5 记录
        run: |
          python -c "
          import json, os, commentjson

          task_file = 'task/task.json'
          if os.path.exists(task_file):
              with open(task_file, 'r', encoding='utf-8') as f:
                  data = commentjson.load(f)
              
              for item in data:
                  if isinstance(item, dict) and item.get('name') == 'leevi':
                      item['md5'] = ''
                      print('成功重置 leevi 的 MD5 记录！')
                      break

              with open(task_file, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
          "

      - name: 运行原版 sync.py
        run: |
          python scripts/sync.py

      - name: 加密 leevi.json
        run: |
          if [ -f "json/leevi.json" ]; then
            python scripts/tvbox.py "json/leevi.json" "json/leevi.bin" enc || true
          fi

      - name: 配置 SSH 传输
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host gitee.com
            HostName gitee.com
            User git
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no" >> ~/.ssh/config

      - name: 推送到 Gitee
        run: |
          # 按照 sync.yml 的方法，克隆 Gitee 目标仓库
          git clone git@gitee.com:child9527/mybox.git gitee_temp
          cd gitee_temp

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p json task

          # 覆盖加密后的 leevi.json
          if [ -f "../json/leevi.bin" ]; then
            cp "../json/leevi.bin" "json/leevi.json"
          fi

          # 同步更新后的 task.json
          if [ -f "../task/task.json" ]; then
            cp "../task/task.json" "task/task.json"
          fi

          git add json/leevi.json task/task.json

          if [ -n "$(git status --porcelain)" ]; then
            NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "临时重置并更新 leevi.json 及 task.json (${NOW}) [skip ci]"
            git pull --rebase origin master
            git push origin master
          else
            echo "🎉 Gitee 侧无变动，跳过推送"
          fi
