name: 同步 software 的公共文件

on:
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 克隆 software 仓库
        run: |
          git clone --depth 1 https://github.com/child9527/software.git /tmp/software

      - name: 复制公共文件
        run: |
          mkdir -p scripts templates/components

          # Python 公共模块
          cp /tmp/software/scripts/renderer.py scripts/
          cp /tmp/software/scripts/sections.py scripts/

          # requirements.txt
          cp /tmp/software/requirements.txt ./

          # 模板
          cp /tmp/software/templates/base.html.j2 templates/
          cp /tmp/software/templates/components/copy_cards.html.j2 templates/components/
          cp /tmp/software/templates/components/copy_cards_wide.html.j2 templates/components/

          # 注意：software_list.html.j2 不复制
          # 因为 clash-latest 和 tvbox 用不到这个板块

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add scripts/renderer.py scripts/sections.py requirements.txt templates/

          if ! git diff --staged --quiet; then
            git commit -m "自动同步 software 的公共文件"
            git push
            echo "✅ 已同步"
          else
            echo "ℹ️ 无变化，跳过提交"
          fi
