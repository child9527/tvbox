name: 删除手动runs

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: 删除所有手动触发的 runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始删除所有手动触发（workflow_dispatch）的 runs..."

          gh api \
            -X GET \
            "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --paginate \
            --jq '.workflow_runs[] | select(.event=="workflow_dispatch") | .id' |
          while read -r run_id; do
              echo "删除手动 run: $run_id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" --silent || \
                  echo "删除失败: $run_id（继续下一条）"
          done

          echo "完成删除所有手动触发的 runs。"
