name: 恢复 JSON 到昨天版本（一次性任务）

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    name: 恢复 json 目录到昨天的版本

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须完整历史才能找到昨天的提交

      - name: 找到昨天的提交
        id: find_yesterday
        run: |
          echo "当前时间：$(date)"
          echo "查找昨天的提交..."

          # 昨天的日期（格式：YYYY-MM-DD）
          YESTERDAY=$(date -d "yesterday" +"%Y-%m-%d")

          echo "昨天日期: $YESTERDAY"

          # 找到昨天的第一个提交（不管哪个，只要是昨天）
          COMMIT=$(git log --since="$YESTERDAY 00:00" --until="$YESTERDAY 23:59" --pretty=format:"%H" | head -n 1)

          if [ -z "$COMMIT" ]; then
            echo "❌ 昨天没有任何提交，无法恢复"
            exit 1
          fi

          echo "找到昨天的提交：$COMMIT"
          echo "commit_sha=$COMMIT" >> $GITHUB_OUTPUT

      - name: 恢复 json 目录到昨天版本
        run: |
          COMMIT=${{ steps.find_yesterday.outputs.commit_sha }}

          echo "从提交 $COMMIT 恢复 json 目录..."

          # 从昨天的提交恢复 json 目录内容
          git checkout "$COMMIT" -- json/

          echo "恢复完成，准备提交"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add json/
            git commit -m "恢复 json 目录到昨天版本 [skip ci]"
            git push origin main
            echo "✔ 已推送到 GitHub"
          else
            echo "— 没有任何变化，不需要提交"
          fi
