name: Update Task JSON Remote MD5 (Temporary)

on:
  workflow_dispatch: # 仅支持手动触发

jobs:
  update-md5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run temporary MD5 updater script
        run: |
          python -c '
          import os, json, requests, hashlib, re

          TASK_FILE = os.path.join("task", "task.json")
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def extract_raw(url):
              if not isinstance(url, str): return False, url
              pat = r"(https?://)?(raw\.githubusercontent\.com|github\.com)/[^\s\"'\''<>]+"
              m = re.search(pat, url)
              if not m: return False, url
              raw = m.group(0)
              if not raw.startswith("http"): raw = "https://" + raw
              raw = re.sub(r"https://github\.com/([^/]+)/([^/]+)/blob/([^/]+)/(.*)", r"https://raw.githubusercontent.com/\1/\2/\3/\4", raw)
              raw = raw.replace("/refs/heads/", "/")
              return True, raw

          if os.path.exists(TASK_FILE):
              with open(TASK_FILE, "r", encoding="utf-8") as f:
                  tasks = json.load(f)

              updated_count = 0
              for t in tasks:
                  url = t.get("url")
                  if not url: continue
                  
                  is_gh, raw = extract_raw(url)
                  try:
                      r = requests.get(raw if is_gh else url, headers=HEADERS, timeout=10)
                      if r.status_code == 200:
                          raw_content = r.content.decode("utf-8", errors="ignore").strip()
                          remote_md5 = hashlib.md5(raw_content.encode("utf-8")).hexdigest()
                          if t.get("md5") != remote_md5:
                              t["md5"] = remote_md5
                              updated_count += 1
                  except Exception as e:
                      pass

              with open(TASK_FILE, "w", encoding="utf-8") as f:
                  json.dump(tasks, f, ensure_ascii=False, indent=2)
                  
              print(f"✅ 完成！共更新了 {updated_count} 个条目的远程 MD5。")
          '

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add task/task.json
          git status
          git diff-index --quiet HEAD || git commit -m "chore: 初始化/校准 task.json 为远程源文件 MD5"
          git push
