name: 解密官方XC.json到根目录

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decrypt-xc:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          pip install pycryptodome

      - name: 下载 XC.json（你指定的 mtv6.json）
        run: |
          wget -O XC.json "https://gitee.com/child9527/mybox/raw/master/json/mtv6.json"

      - name: 解密 XC.json（你已经更新过的 tvbox.py）
        run: |
          python scripts/tvbox.py XC.json XC_decrypted.json

      - name: 提交解密结果到仓库根目录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add XC_decrypted.json

          if [ -n "$(git status --porcelain XC_decrypted.json)" ]; then
            git commit -m "自动解密 XC.json → XC_decrypted.json [skip ci]"
            git push
            echo "已推送解密文件到仓库根目录"
          else
            echo "无变化，跳过提交"
          fi
