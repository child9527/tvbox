name: Temp Sync Leevi & Push

on:
  workflow_dispatch:

jobs:
  temp-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests commentjson

      - name: 只重置 leevi 的 MD5 记录
        run: |
          python -c "
          import json, os, commentjson

          task_file = 'task/task.json'
          if os.path.exists(task_file):
              with open(task_file, 'r', encoding='utf-8') as f:
                  data = commentjson.load(f)
              
              # 仅寻找 name 为 leevi 的项并将其 MD5 置空
              for item in data:
                  if isinstance(item, dict) and item.get('name') == 'leevi':
                      item['md5'] = ''
                      print('成功重置 leevi 的 MD5 记录！')
                      break

              with open(task_file, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
          "

      - name: 运行原版 sync.py
        run: |
          python scripts/sync.py

      - name: 配置 Git 并推送到 Gitee
        env:
          GITEE_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存变更
          git add json/ task/

          # 检查是否有变更并提交
          if git diff --staged --quiet; then
            echo "没有识别到文件变更"
          else
            git commit -m "build: 重新清洗并更新 leevi 镜像配置 [skip ci]"
          fi

          # 配置 SSH 密钥并推送至 Gitee
          mkdir -p ~/.ssh
          echo "$GITEE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

          git remote add gitee git@gitee.com:child9527/tvbox.git || git remote set-url gitee git@gitee.com:child9527/tvbox.git
          git push -f gitee main
