name: 解密 XC.json（保持 dec 调用方式）

on:
  workflow_dispatch:

jobs:
  decode-xc:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 尝试用 tvbox.py dec 解密（你要求的最初方式）
        id: try_dec
        run: |
          echo "开始使用 tvbox.py dec 解密 XC.json（最初方式）..."
          if python scripts/tvbox.py \
            "https://github.com/yoursmile66/TVBox/raw/main/XC.json" \
            "XC.json" \
            dec; then
            echo "dec_ok=true" >> $GITHUB_OUTPUT
          else
            echo "dec_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: 如果 dec 失败，则自动 gzip 解压还原 JSON（补救逻辑）
        if: steps.try_dec.outputs.dec_ok == 'false'
        run: |
          echo "tvbox.py dec 失败，开始自动 gzip 解压 XC.json..."

          python - << 'EOF'
          import gzip
          import json
          import urllib.request

          url = "https://github.com/yoursmile66/TVBox/raw/main/XC.json"
          output = "XC.json"

          print(f"下载 XC.json: {url}")

          req = urllib.request.Request(url, headers={
              "User-Agent": "okhttp/3.12.0",
              "Accept-Encoding": "gzip"
          })

          with urllib.request.urlopen(req, timeout=30) as resp:
              raw = resp.read()

          print("✓ 下载成功，尝试 gzip 解压...")

          try:
              data = gzip.decompress(raw)
              print("✓ gzip 解压成功")
          except Exception as e:
              print("✗ gzip 解压失败:", e)
              raise SystemExit(1)

          try:
              text = data.decode("utf-8", "ignore")
              obj = json.loads(text)
              print("✓ JSON 解析成功")
          except Exception as e:
              print("✗ JSON 解析失败:", e)
              print("内容前 200 字符：")
              print(text[:200])
              raise SystemExit(1)

          with open(output, "w", encoding="utf-8") as f:
              json.dump(obj, f, ensure_ascii=False, indent=2)

          print(f"✓ 已保存到根目录: {output}")
          EOF

      - name: 提交结果到仓库根目录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add XC.json

          if ! git diff --staged --quiet; then
            git commit -m "自动解密 XC.json（含 dec fallback）"
            git push
          else
            echo "XC.json 无变化，跳过提交。"
          fi

