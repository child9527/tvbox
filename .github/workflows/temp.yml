name: 解密 XC.json（保持 dec 调用方式）

on:
  workflow_dispatch:

jobs:
  decode-xc:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ← 关键修复点：允许 git push

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 尝试用 tvbox.py dec 解密（你要求的最初方式）
        id: try_dec
        run: |
          echo "开始使用 tvbox.py dec 解密 XC.json（最初方式）..."
          python scripts/tvbox.py "https://github.com/yoursmile66/TVBox/raw/main/XC.json" "XC.json" dec

      - name: 提交结果到仓库根目录XC
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add XC.json

          if ! git diff --staged --quiet; then
            git commit -m "自动解密 XC.json（含 dec fallback）"
            git push
          else
            echo "XC.json 无变化，跳过提交。"
          fi
