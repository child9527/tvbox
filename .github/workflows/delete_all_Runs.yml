name: 删除所有Runs和Artifacts

on:
  schedule:
    # 每月29号运行一次（北京时间 29 号凌晨 1 点）
    - cron: '0 17 28 * *'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  del_all:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # 必须开启写权限，才能删除日志和 Artifacts
    steps:
      - name: Delete ALL Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清空所有 Artifacts 产物..."

          # 先一次性收集全部 ID，避免边删边翻页导致漏删
          gh api -X GET "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate --jq '.artifacts[].id' > /tmp/artifacts.txt

          while read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              echo "正在删除 Artifact ID: $artifact_id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" --silent \
                || echo "?? 删除 Artifact 失败: $artifact_id"
            fi
          done < /tmp/artifacts.txt

          echo "所有 Artifacts 已清理完毕！"

      - name: Delete ALL Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清空所有工作流运行日志..."

          # 先一次性收集全部 ID
          gh api -X GET "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --paginate --jq '.workflow_runs[].id' > /tmp/runs.txt

          while read -r run_id; do
            # 跳过当前正在执行的这一次，避免自己删自己
            if [ -n "$run_id" ] && [ "$run_id" != "${{ github.run_id }}" ]; then
              echo "正在删除日志 ID: $run_id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" --silent \
                || echo "?? 删除 Run 失败: $run_id"
            else
              echo "跳过当前运行: $run_id"
            fi
          done < /tmp/runs.txt

          echo "所有历史日志已清理完毕！"
