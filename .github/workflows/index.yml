name: 生成首页index.html

on:
  push:
    paths:
      - "scripts/index.py"
      - "lives/**"

  workflow_run:
    workflows:
      - "批量同步、加密与双端推送"
    types:
      - completed

  #schedule:
  #  - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build-index:
    name: 自动生成首页
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN_FOR_INDEX: ${{ secrets.GITEE_TOKEN_FOR_INDEX }}
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: 创建index.html
        run: |
          python scripts/index.py

      - name: 提交index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto Update index.html"
            git push
          else
            echo "index.html 无变化，跳过提交"
          fi
