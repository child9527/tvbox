name: 自动更新分流规则文件

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'direct.txt'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 生成分流配置文件
        run: |
          python -c "
          import os

          def convert_txt_to_cfg(txt_file, cfg_file):
              print(f'[提示] 正在处理: {txt_file} -> {cfg_file}')
              if not os.path.exists(txt_file):
                  print(f'[警告] 源文件 {txt_file} 不存在，跳过。')
                  return
              
              domains = []
              with open(txt_file, 'r', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      # 过滤注释与空行
                      if line and not line.startswith('#'):
                          if line not in domains:
                              domains.append(line)
              
              # 用 ',\n' 拼接：前 N-1 行末尾全带英文逗号，最后一行不带
              content = ',\n'.join(domains) + '\n' if domains else ''
              
              with open(cfg_file, 'w', encoding='utf-8') as f:
                  f.write(content)
              
              print(f'[成功] 生成文件 {cfg_file}，共处理 {len(domains)} 条域名')

          # 仅执行 direct.txt 的转换
          convert_txt_to_cfg('direct.txt', 'my_direct.cfg')
          "

      - name: 配置 SSH 密钥
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/gitee_id_ed25519
          chmod 600 ~/.ssh/gitee_id_ed25519
          
          cat << 'EOF' > ~/.ssh/config
          Host gitee.com
              HostName gitee.com
              User git
              IdentityFile ~/.ssh/gitee_id_ed25519
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config
          ssh -T git@gitee.com || true

      - name: 推送生成文件到 Gitee
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git clone git@gitee.com:child9527/mybox.git gitee_temp
          
          # 仅复制 my_direct.cfg 到目标目录
          [ -f my_direct.cfg ] && cp -v my_direct.cfg gitee_temp/
          
          cd gitee_temp
          
          git add .
          if git diff --staged --quiet; then
            echo "[提示] 没有发现文件变更，跳过提交。"
          else
            # 获取当前北京时间 (UTC+8) 并格式化为 年-月-日 时:分
            NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "auto: 更新 cfg 规则文件 ${NOW} [skip ci]"
            git push origin master
            echo "[成功] 已成功推送最新规则文件至 Gitee！"
          fi
