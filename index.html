    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #ff4757;
            --success-color: #2ecc71;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }
        
        h2 { 
            color: var(--accent-color); 
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-top: 30px;
            font-size: 1.5rem;
        }

        .section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .compact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        .data-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #363636;
            border-radius: 6px;
            border: 1px solid #404040;
            transition: background 0.2s, border-color 0.2s;
        }

        .data-card:hover {
            background: #404040;
            border-color: #555;
        }

        .data-label { 
            color: #ddd; 
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 12px;
        }

        .copy-pill { 
            font-size: 0.8rem;
            color: #bbb; 
            cursor: pointer;
            background: #2b2b2b;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #484848;
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .copy-pill:hover { 
            background: #4a4a4a; 
            color: #fff;
            border-color: #666;
        }

        .copy-pill.copied {
            background: rgba(46, 204, 113, 0.15);
            color: var(--success-color);
            border-color: var(--success-color);
        }
    </style>
</head>

<script>
function copy(el) {
    const value = el.getAttribute("data-value");
    navigator.clipboard.writeText(value).then(() => {
        el.classList.add("copied");
        el.innerText = "已复制";
        setTimeout(() => {
            el.classList.remove("copied");
            el.innerText = "点击复制";
        }, 1500);
    });
}
</script>
